<!doctype html>
<html lang="sk">
<head>
<base href="../web/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vybrané slová tests</title>
<style>
  body {
    margin: 0;
    padding: 28px;
    background: #fffdf7;
    color: #24221e;
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  h1 { margin-top: 0; }

  #summary {
    display: inline-block;
    margin: 12px 0 18px;
    padding: 8px 12px;
    border: 1px solid #d8d0c3;
    border-radius: 8px;
    font-weight: 800;
  }

  .pass { color: #166534; }
  .fail { color: #991b1b; }
  li { margin: 6px 0; }
</style>
</head>
<body>
<h1>Vybrané slová tests</h1>
<div id="summary">Running...</div>
<ol id="results"></ol>

<script src="./engine.js"></script>
<script src="./avatars.js"></script>
<script>
const Engine = window.VybraneSlovaEngine;
const Avatars = window.VybraneSlovaAvatars;
const results = document.querySelector('#results');
const summary = document.querySelector('#summary');
const tests = [];

function test(name, fn) {
  tests.push({ name, fn });
}

function assert(condition, message) {
  if (!condition) throw new Error(message);
}

function equal(actual, expected, message) {
  if (actual !== expected) {
    throw new Error(`${message}: expected ${expected}, got ${actual}`);
  }
}

function makeStorage() {
  const map = new Map();
  return {
    getItem(key) {
      return map.has(key) ? map.get(key) : null;
    },
    setItem(key, value) {
      map.set(key, String(value));
    },
    removeItem(key) {
      map.delete(key);
    },
  };
}

async function run() {
  const tsv = await fetch('./data/disambiguation.tsv').then(response => response.text());
  const rows = Engine.parseTsv(tsv);
  const readyCards = Engine.loadDisambiguationCards(tsv);
  const allReviewCards = Engine.loadDisambiguationCards(tsv, { statuses: ['review'] });
  const simpleLetters = ['b', 'm', 'p', 'r', 's', 'v', 'z'];
  const simpleLists = Object.fromEntries(await Promise.all(simpleLetters.map(async letter => [
    letter,
    await fetch(`./data/simple/${letter}.txt`).then(response => response.text()),
  ])));
  const simpleCards = Engine.loadSimpleCards(simpleLists);

  test('parses the disambiguation TSV', () => {
    equal(rows.length, 30, 'row count');
  });

  test('loads only ready cards by default', () => {
    equal(readyCards.length, 28, 'ready count');
    assert(!readyCards.some(card => card.status !== 'ready'), 'non-ready card loaded');
  });

  test('keeps review rows out of the starter lesson', () => {
    equal(allReviewCards.length, 2, 'review count');
    assert(!readyCards.some(card => card.pair_id === 'by-bi'), 'by/bi should stay review-only');
  });

  test('loads the complete simple-word pool', () => {
    equal(simpleCards.length, 382, 'simple card count');
    const counts = Engine.answerCounts(simpleCards);
    equal(counts.i, 203, 'simple i answer count');
    equal(counts.y, 179, 'simple y answer count');
  });

  test('masks the letter after the selected-word consonant', () => {
    const bicycle = simpleCards.find(card => card.surface === 'bicykel');
    equal(bicycle.masked_surface, 'b_cykel', 'bicykel target mask');
    equal(bicycle.missing_letter, 'i', 'bicykel target letter');
    equal(bicycle.prompt_sentence, '', 'simple cards have no prompt');
    const fish = simpleCards.find(card => card.surface === 'ryba');
    equal(fish.masked_surface, 'r_ba', 'ryba target mask');
    equal(fish.answer_group, 'y', 'ryba answer group');
    const mole = simpleCards.find(card => card.surface === 'ryť');
    equal(mole.masked_surface, 'r_ť', 'ryť target mask');
    equal(mole.prompt_sentence, 'Krtko ryje v zemi.', 'ryť clue');
    const shimmer = simpleCards.find(card => card.surface === 'kmitať');
    const roofTile = simpleCards.find(card => card.surface === 'škridla');
    equal(shimmer.masked_surface, 'km_tať', 'kmitať target mask');
    equal(roofTile.masked_surface, 'škr_dla', 'škridla target mask');
  });

  test('keeps ready answers balanced', () => {
    const counts = Engine.answerCounts(readyCards);
    equal(counts.i, 14, 'i answer count');
    equal(counts.y, 14, 'y answer count');
  });

  test('masks the target letter in context', () => {
    const vyr = readyCards.find(card => card.surface === 'výr');
    equal(vyr.masked_surface, 'v_r', 'masked surface');
    equal(vyr.prompt_sentence, 'Na strome sedí veľký v_r.', 'prompt sentence');
    equal(vyr.full_sentence, 'Na strome sedí veľký výr.', 'full sentence');
  });

  test('keeps charging and conquering in separate context cards', () => {
    const recharge = readyCards.find(card => card.surface === 'dobíjať');
    const conquer = readyCards.find(card => card.surface === 'dobýjať');
    equal(recharge.prompt_sentence, 'Chcem dob_jať baterku v telefóne.', 'recharge prompt');
    equal(conquer.prompt_sentence, 'V hre chceme dob_jať pevnosť.', 'conquer prompt');
    equal(recharge.answer_group, 'i', 'recharge answer');
    equal(conquer.answer_group, 'y', 'conquer answer');
  });

  test('moves other real spelling contrasts into context cards', () => {
    const squeal = readyCards.find(card => card.surface === 'výskať');
    const groom = readyCards.find(card => card.surface === 'vískať');
    const howl = readyCards.find(card => card.surface === 'zavýjať');
    const wrap = readyCards.find(card => card.surface === 'zavíjať');
    const rhyme = readyCards.find(card => card.surface === 'rým');
    const rome = readyCards.find(card => card.surface === 'Rím');
    equal(squeal.answer_group, 'y', 'squeal answer');
    equal(groom.answer_group, 'i', 'groom answer');
    equal(howl.answer_group, 'y', 'howl answer');
    equal(wrap.answer_group, 'i', 'wrap answer');
    equal(rhyme.answer_group, 'y', 'rhyme answer');
    equal(rome.answer_group, 'i', 'Rome answer');
    assert(!simpleCards.some(card => ['výskať', 'zavýjať', 'rým'].includes(card.surface)), 'ambiguous cards stay out of simple lists');
  });

  test('keeps the cheese prompt grammatical without revealing its answer', () => {
    const syr = readyCards.find(card => card.surface === 'syr');
    equal(syr.prompt_sentence, 'Na tanieri je s_r.', 'masked cheese prompt');
    equal(syr.full_sentence, 'Na tanieri je syr.', 'full cheese sentence');
  });

  test('checks answers by side group', () => {
    const vir = readyCards.find(card => card.surface === 'vír');
    assert(Engine.checkAnswer(vir, 'i'), 'i should be correct');
    assert(Engine.checkAnswer(vir, 'í'), 'í should normalize to i');
    assert(!Engine.checkAnswer(vir, 'y'), 'y should be incorrect');
  });

  test('filters cards by several selected letters', () => {
    const cards = Engine.filterCardsByLetters(readyCards, ['b', 'm']);
    assert(cards.length > 0, 'selected letters should have cards');
    assert(cards.every(card => ['b', 'm'].includes(card.selected_letter)), 'unexpected letter in filtered cards');
    assert(!cards.some(card => card.selected_letter === 'v'), 'unselected letter was included');
  });

  test('creates deterministic rounds when seeded', () => {
    const first = Engine.createRound(readyCards, { size: 5, seed: 42 }).map(card => card.id).join(',');
    const second = Engine.createRound(readyCards, { size: 5, seed: 42 }).map(card => card.id).join(',');
    equal(first, second, 'seeded order');
  });

  test('records progress with versioned storage', () => {
    const storage = makeStorage();
    const card = readyCards[0];
    let progress = Engine.loadProgress(storage);
    progress = Engine.recordAnswer(progress, card, true, 1234);
    Engine.saveProgress(progress, storage);
    const saved = Engine.loadProgress(storage);
    equal(saved.version, 1, 'storage version');
    equal(saved.totalAnswered, 1, 'total answered');
    equal(saved.totalCorrect, 1, 'total correct');
    equal(saved.cards[card.id].seen, 1, 'card seen');
  });

  test('keeps answering when storage writes fail', () => {
    const storage = {
      getItem() {
        return null;
      },
      setItem() {
        throw new Error('storage blocked');
      },
    };
    const card = readyCards[0];
    const progress = Engine.recordAnswer(Engine.loadProgress(storage), card, false, 5678);
    const saved = Engine.saveProgress(progress, storage);
    equal(saved.totalAnswered, 1, 'total answered after failed save');
    equal(saved.totalCorrect, 0, 'total correct after failed save');
    equal(saved.cards[card.id].seen, 1, 'card seen after failed save');
  });

  test('draws every avatar as a 16x16 pixel head', () => {
    equal(new Set(Avatars.AVATAR_KEYS).size, Avatars.AVATARS.length, 'unique avatar keys');
    for (const key of ['elephant', 'gorilla', 'peacock', 'flamingo']) {
      assert(Avatars.avatarByKey(key), `missing ${key}`);
    }
    for (const avatar of [...Avatars.AVATARS, Avatars.GUEST]) {
      assert(avatar.label, `${avatar.key} label`);
      equal(avatar.rows.length, 16, `${avatar.key} row count`);
      for (const row of avatar.rows) {
        equal(row.length, 16, `${avatar.key} row width`);
        assert(Array.from(row).every(char => char === '.' || avatar.palette[char]), `${avatar.key} uses unknown colour in ${row}`);
      }
      assert(Avatars.avatarSvg(avatar).includes('<rect'), `${avatar.key} renders pixels`);
    }
  });

  test('starts without profiles', () => {
    const profiles = Engine.loadProfiles(makeStorage(), Avatars.AVATAR_KEYS);
    equal(profiles.profiles.length, 0, 'profile count');
    equal(profiles.activeId, null, 'active profile');
    equal(Engine.activeProfile(profiles), null, 'no active profile');
  });

  test('tidies names typed by children', () => {
    equal(Engine.normalizeProfileName('  mia   sofia '), 'Mia sofia', 'trims, collapses, capitalizes');
    equal(Engine.normalizeProfileName('ľubo'), 'Ľubo', 'capitalizes Slovak letters');
    equal(Engine.normalizeProfileName('Maximiliánko Veľký'), 'Maximiliánko Veľ', 'limits length by letters');
    equal(Engine.normalizeProfileName(null), '', 'missing name');
  });

  test('adds, edits, selects, and removes profiles', () => {
    let profiles = Engine.loadProfiles(makeStorage(), Avatars.AVATAR_KEYS);
    profiles = Engine.addProfile(profiles, { name: ' ema ', avatar: 'flamingo' }, 1000);
    const ema = Engine.activeProfile(profiles);
    equal(ema.name, 'Ema', 'first name');
    equal(ema.avatar, 'flamingo', 'first avatar');
    profiles = Engine.addProfile(profiles, { name: 'Jakub', avatar: 'gorilla' }, 1000);
    const jakub = Engine.activeProfile(profiles);
    assert(jakub.id !== ema.id, 'ids stay unique for the same timestamp');
    profiles = Engine.selectProfile(profiles, ema.id);
    equal(profiles.activeId, ema.id, 'selected profile');
    profiles = Engine.selectProfile(profiles, 'missing');
    equal(profiles.activeId, ema.id, 'unknown profile is ignored');
    profiles = Engine.updateProfile(profiles, jakub.id, { name: 'kubo', avatar: 'lion' });
    equal(profiles.profiles[1].name, 'Kubo', 'edited name');
    equal(profiles.profiles[1].avatar, 'lion', 'edited avatar');
    profiles = Engine.removeProfile(profiles, ema.id);
    equal(profiles.profiles.length, 1, 'remaining profiles');
    equal(profiles.activeId, jakub.id, 'removing the active profile selects another');
    profiles = Engine.removeProfile(profiles, jakub.id);
    equal(profiles.activeId, null, 'removing the last profile returns to guest');
  });

  test('stores profiles and repairs unknown values', () => {
    const storage = makeStorage();
    let profiles = Engine.addProfile(Engine.loadProfiles(storage, Avatars.AVATAR_KEYS), { name: 'Ema', avatar: 'peacock' }, 1);
    Engine.saveProfiles(profiles, storage);
    const saved = Engine.loadProfiles(storage, Avatars.AVATAR_KEYS);
    equal(saved.profiles[0].name, 'Ema', 'saved name');
    equal(saved.activeId, profiles.activeId, 'saved active profile');

    storage.setItem(Engine.STORAGE_KEYS.profiles, JSON.stringify({
      version: 1,
      activeId: 'gone',
      profiles: [{ id: 'a', name: 'Ema', avatar: 'dragon' }, { id: 'a', name: 'Copy', avatar: 'fox' }, null],
    }));
    const repaired = Engine.loadProfiles(storage, Avatars.AVATAR_KEYS);
    equal(repaired.profiles.length, 1, 'drops duplicate and broken profiles');
    equal(repaired.profiles[0].avatar, Avatars.AVATAR_KEYS[0], 'unknown avatar falls back');
    equal(repaired.activeId, 'a', 'missing active profile falls back');
  });

  test('keeps progress separate for each profile', () => {
    const storage = makeStorage();
    const card = readyCards[0];
    Engine.saveProgress(Engine.recordAnswer(Engine.loadProgress(storage, 'p1'), card, true, 1), storage, 'p1');
    equal(Engine.loadProgress(storage, 'p1').totalAnswered, 1, 'profile progress');
    equal(Engine.loadProgress(storage, 'p2').totalAnswered, 0, 'other profile progress');
    equal(Engine.loadProgress(storage).totalAnswered, 0, 'guest progress');
  });

  test('the first profile keeps practice done before profiles existed', () => {
    const storage = makeStorage();
    const card = readyCards[0];
    Engine.saveProgress(Engine.recordAnswer(Engine.loadProgress(storage), card, true, 1), storage);
    storage.setItem(Engine.STORAGE_KEYS.settings, JSON.stringify({ selectedLetters: ['b'] }));
    Engine.adoptGuestData(storage, 'p1');
    equal(Engine.loadProgress(storage, 'p1').totalAnswered, 1, 'adopted progress');
    equal(Engine.loadProgress(storage).totalAnswered, 0, 'guest progress moved');
    equal(storage.getItem(Engine.profileStorageKey(Engine.STORAGE_KEYS.settings, 'p1')), '{"selectedLetters":["b"]}', 'adopted settings');
    Engine.removeProfileData(storage, 'p1');
    equal(Engine.loadProgress(storage, 'p1').totalAnswered, 0, 'removed progress');
    equal(storage.getItem(Engine.profileStorageKey(Engine.STORAGE_KEYS.settings, 'p1')), null, 'removed settings');
  });

  test('never overwrites a profile or removes guest practice by accident', () => {
    const storage = makeStorage();
    const card = readyCards[0];
    Engine.saveProgress(Engine.recordAnswer(Engine.loadProgress(storage), card, true, 1), storage);
    let own = Engine.recordAnswer(Engine.loadProgress(storage, 'p1'), card, false, 2);
    own = Engine.recordAnswer(own, card, false, 3);
    Engine.saveProgress(own, storage, 'p1');
    Engine.adoptGuestData(storage, 'p1');
    equal(Engine.loadProgress(storage, 'p1').totalAnswered, 2, 'profile keeps its own progress');
    equal(Engine.loadProgress(storage).totalAnswered, 1, 'guest progress stays when not adopted');
    Engine.removeProfileData(storage, null);
    equal(Engine.loadProgress(storage).totalAnswered, 1, 'removing without a profile leaves guest progress');
  });

  test('grows word mastery with repeated correct answers', () => {
    const card = readyCards[0];
    const answer = (progress, results) => results.reduce((next, isCorrect, index) => Engine.recordAnswer(next, card, isCorrect, index), progress);
    const level = results => Engine.masteryLevel(answer(Engine.defaultProgress(), results).cards[card.id]);
    equal(Engine.masteryLevel(undefined), 0, 'unseen word');
    equal(level([false]), 0, 'only mistakes');
    equal(level([true]), 1, 'one correct answer');
    equal(level([true, true]), 3, 'two correct answers');
    equal(level([true, true, true]), Engine.MASTERY_MAX_LEVEL, 'three correct answers');
    equal(level([false, true, true, true]), 3, 'an early mistake still counts');
    equal(level([false, true, true, true, true, true, true, true]), Engine.MASTERY_MAX_LEVEL, 'practice earns mastery back');
  });

  test('basic membership preserves cards, context, limits and balance', async () => {
    const membership = await fetch('./data/basic.json').then(response => response.json());
    const all = [...simpleCards, ...readyCards];
    const basic = Engine.selectBasicCards(all, membership);
    equal(basic.length, 172, 'basic size');
    for (const letter of simpleLetters) {
      const counts = Engine.answerCounts(Engine.filterCardsByLetters(basic, [letter]));
      assert(counts.i <= 20 && counts.y <= 20, 'basic limit exceeded');
      assert(counts.i >= counts.y && counts.y > 0, 'basic balance');
    }
    const cheese = basic.find(card => card.surface === 'syr');
    equal(cheese.id, readyCards.find(card => card.surface === 'syr').id, 'stable contrast ID');
    assert(cheese.sentence.includes('{target}'), 'contrast context preserved');
    assert(!basic.some(card => card.status !== 'ready'), 'basic enabled unreviewed card');
    assert(all.length > basic.length, 'extended pool retained');
    let rejected = false;
    try { Engine.selectBasicCards(all, { b: { i: ['missing'], y: [] } }); }
    catch (_error) { rejected = true; }
    assert(rejected, 'unknown basic references must fail');
  });

  test('daily history separates repeated attempts, distinct words and local dates', () => {
    const first = new Date(2026, 10, 9, 23, 59).getTime();
    const next = new Date(2026, 10, 10, 0, 1).getTime();
    let progress = Engine.recordAnswer(Engine.defaultProgress(), readyCards[0], false, first);
    progress = Engine.recordAnswer(progress, readyCards[0], true, first);
    progress = Engine.recordAnswer(progress, readyCards[1], true, next);
    const report = Engine.practiceOverview(progress, readyCards, next);
    equal(report.days.length, 8, 'today plus previous seven days');
    equal(report.days[0].date, '2026-11-10', 'local day');
    equal(report.days[0].answered, 1, 'today attempts');
    equal(report.days[1].answered, 2, 'yesterday attempts');
    equal(report.days[1].words, 1, 'yesterday distinct words');
    equal(report.days[1].correct, 1, 'yesterday correct');
    equal(report.total.words, 2, 'period distinct words');
    equal(report.total.answered, 3, 'period attempts');
    equal(report.letters.b.answered, 3, 'letter attempts');
    equal(report.needsPractice[0].card.id, readyCards[0].id, 'word needing practice');
    equal(report.days[2].answered, 0, 'empty day');
    equal(Engine.defaultProgress().totalAnswered, 0, 'fresh progress is empty');
  });

  test('migration preserves totals without inventing daily history', () => {
    const storage = makeStorage();
    const old = { version: 1, totalAnswered: 8, totalCorrect: 6,
      cards: { [readyCards[0].id]: { seen: 8, correct: 6, lastAnsweredAt: 1234 } }, updatedAt: 1234 };
    storage.setItem(Engine.STORAGE_KEYS.progress, JSON.stringify(old));
    const migrated = Engine.loadProgress(storage);
    equal(migrated.totalAnswered, 8, 'old totals retained');
    equal(Object.keys(migrated.days).length, 0, 'no fabricated daily data');
    const now = new Date(2026, 0, 1, 12).getTime();
    const updated = Engine.recordAnswer(migrated, readyCards[0], true, now);
    Engine.saveProgress(updated, storage);
    const restored = Engine.loadProgress(storage);
    equal(restored.totalAnswered, 9, 'new answer added to old totals');
    equal(Engine.practiceOverview(restored, readyCards, now).total.answered, 1, 'only new history reported');
    const feb = new Date(2026, 1, 1, 12).getTime();
    const empty = Engine.practiceOverview(restored, readyCards, feb);
    equal(empty.total.answered, 0, 'old daily results excluded from recent period');
    equal(empty.days[1].date, '2026-01-31', 'month boundary');
    equal(Engine.practiceOverview(Engine.defaultProgress(), readyCards, now).days[1].date,
      '2025-12-31', 'year boundary');
  });

  test('daily history follows profile migration, isolation and removal', () => {
    const storage = makeStorage();
    const now = new Date(2026, 10, 10, 12).getTime();
    const card = readyCards[0];
    const guest = Engine.recordAnswer(Engine.defaultProgress(), card, true, now);
    Engine.saveProgress(guest, storage);
    Engine.adoptGuestData(storage, 'first');
    equal(Engine.practiceOverview(Engine.loadProgress(storage, 'first'), readyCards, now).total.answered, 1, 'guest daily history adopted');
    equal(Engine.practiceOverview(Engine.loadProgress(storage, 'second'), readyCards, now).total.answered, 0, 'second child starts empty');
    Engine.saveProgress(Engine.recordAnswer(Engine.loadProgress(storage, 'second'), card, false, now), storage, 'second');
    equal(Engine.practiceOverview(Engine.loadProgress(storage, 'first'), readyCards, now).total.correct, 1, 'first child unchanged');
    equal(Engine.practiceOverview(Engine.loadProgress(storage, 'second'), readyCards, now).total.correct, 0, 'second child separate');
    Engine.removeProfileData(storage, 'second');
    equal(Engine.practiceOverview(Engine.loadProgress(storage, 'second'), readyCards, now).total.answered, 0, 'removed history is empty');
    equal(Engine.loadProgress(storage, 'first').totalAnswered, 1, 'other child retained');
  });

  let passed = 0;
  for (const item of tests) {
    const li = document.createElement('li');
    try {
      await item.fn();
      li.className = 'pass';
      li.textContent = `PASS ${item.name}`;
      passed++;
    } catch (error) {
      li.className = 'fail';
      li.textContent = `FAIL ${item.name}: ${error.message}`;
    }
    results.appendChild(li);
  }

  const failed = tests.length - passed;
  summary.textContent = `${passed}/${tests.length} passed`;
  summary.className = failed ? 'fail' : 'pass';
  document.title = failed ? `FAIL ${summary.textContent}` : `PASS ${summary.textContent}`;
}

run().catch(error => {
  summary.textContent = `Test runner failed: ${error.message}`;
  summary.className = 'fail';
  document.title = 'FAIL test runner';
});
</script>
</body>
</html>
