<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vybrané slová">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Vybrané slová</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
  :root {
    color-scheme: light;
    --paper: #fffdf7;
    --ink: #25221d;
    --muted: #6b6256;
    --line: #ddd3c5;
    --blue: #d9edff;
    --blue-strong: #2563b8;
    --gold: #ffe4b8;
    --gold-strong: #a8550c;
    --green: #dff5e5;
    --green-strong: #177245;
    --rose: #ffe1e1;
    --rose-strong: #a82f35;
    --shadow: 0 16px 36px rgba(58, 43, 22, 0.14);
  }

  * { box-sizing: border-box; }

  html,
  body {
    margin: 0;
    min-height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    min-height: 100dvh;
  }

  button {
    font: inherit;
  }

  .app {
    min-height: 100dvh;
    padding: calc(18px + env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 16px;
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
  }

  h1 {
    margin: 0;
    font-size: 22px;
    line-height: 1.1;
    letter-spacing: 0;
  }

  .stats {
    display: flex;
    gap: 8px;
    align-items: center;
    color: var(--muted);
    font-size: 14px;
    white-space: nowrap;
  }

  .stat {
    min-width: 74px;
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fffaf0;
    text-align: center;
  }

  .board {
    width: min(1060px, 100%);
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(142px, 1fr) minmax(260px, 1.25fr) minmax(142px, 1fr);
    gap: 14px;
    align-items: stretch;
  }

  .pile {
    min-height: 360px;
    border: 2px solid rgba(37, 34, 29, 0.12);
    border-radius: 8px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    text-align: left;
  }

  .answer-pile {
    cursor: pointer;
    background: #fff;
    color: inherit;
    transition: transform 140ms ease, border-color 140ms ease, box-shadow 140ms ease;
  }

  .answer-pile:hover,
  .answer-pile:focus-visible {
    transform: translateY(-2px);
    border-color: rgba(37, 34, 29, 0.28);
    box-shadow: 0 10px 24px rgba(58, 43, 22, 0.12);
    outline: none;
  }

  .answer-pile.left {
    background: var(--blue);
  }

  .answer-pile.right {
    background: var(--gold);
  }

  .answer-pile.drop-target {
    transform: translateY(-2px);
    border-color: rgba(37, 34, 29, 0.34);
    box-shadow: 0 12px 28px rgba(58, 43, 22, 0.16);
  }

  .source-pile {
    position: relative;
    overflow: hidden;
    background: #fffaf0;
  }

  .pile-letter {
    display: block;
    font-size: clamp(40px, 8vw, 78px);
    line-height: 0.92;
    font-weight: 900;
    letter-spacing: 0;
    white-space: nowrap;
  }

  .pile-name {
    display: block;
    margin-top: 8px;
    color: var(--muted);
    font-size: 14px;
    font-weight: 700;
  }

  .pile-count {
    color: var(--muted);
    font-size: 14px;
    font-weight: 700;
  }

  .card-area {
    position: relative;
    min-height: 256px;
    display: grid;
    place-items: center;
  }

  .ghost-card,
  .word-card {
    width: min(360px, 100%);
    min-height: 196px;
    border: 2px solid rgba(37, 34, 29, 0.15);
    border-radius: 8px;
    background: #fffefa;
    box-shadow: var(--shadow);
  }

  .ghost-card {
    position: absolute;
    inset: auto 50% 28px auto;
    transform: translateX(50%) rotate(-3deg);
    opacity: 0.23;
  }

  .word-card {
    position: relative;
    z-index: 1;
    padding: 20px;
    display: grid;
    align-content: center;
    gap: 14px;
    text-align: center;
    cursor: grab;
    touch-action: none;
    user-select: none;
    transform: translate(var(--drag-x, 0), var(--drag-y, 0)) rotate(var(--drag-rotate, 0deg));
    transition: transform 260ms ease, opacity 260ms ease;
  }

  .word-card.dragging {
    cursor: grabbing;
    transition: none;
  }

  .word-card.move-left {
    transform: translateX(-78%) rotate(-5deg);
    opacity: 0;
  }

  .word-card.move-right {
    transform: translateX(78%) rotate(5deg);
    opacity: 0;
  }

  .masked-word {
    font-size: clamp(42px, 9vw, 72px);
    line-height: 1;
    font-weight: 900;
    letter-spacing: 0;
  }

  .sentence {
    margin: 0;
    color: var(--muted);
    font-size: 20px;
    line-height: 1.35;
  }

  .full-word {
    min-height: 28px;
    font-size: 18px;
    font-weight: 800;
  }

  .feedback {
    min-height: 34px;
    width: min(760px, 100%);
    margin: 0 auto;
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fffaf0;
    text-align: center;
    font-weight: 800;
  }

  .feedback.good {
    border-color: rgba(23, 114, 69, 0.32);
    background: var(--green);
    color: var(--green-strong);
  }

  .feedback.needs-work {
    border-color: rgba(168, 47, 53, 0.3);
    background: var(--rose);
    color: var(--rose-strong);
  }

  .feedback.done {
    border-color: rgba(37, 99, 184, 0.26);
    background: var(--blue);
    color: var(--blue-strong);
  }

  .reset {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fffaf0;
    color: var(--ink);
    padding: 8px 11px;
    font-weight: 800;
    cursor: pointer;
  }

  .reset:focus-visible {
    outline: 3px solid rgba(37, 99, 184, 0.3);
    outline-offset: 2px;
  }

  @media (max-width: 760px) {
    .app {
      padding-left: 10px;
      padding-right: 10px;
      gap: 12px;
    }

    .topbar {
      align-items: flex-start;
    }

    h1 {
      font-size: 20px;
    }

    .stats {
      flex-wrap: wrap;
      justify-content: flex-end;
      font-size: 13px;
    }

    .stat {
      min-width: 64px;
      padding: 6px 8px;
    }

    .board {
      min-height: 0;
      grid-template-columns: 1fr 1.25fr 1fr;
      gap: 8px;
    }

    .pile {
      min-height: 450px;
      padding: 10px;
    }

    .pile-letter {
      font-size: clamp(31px, 12vw, 56px);
    }

    .pile-name,
    .pile-count {
      font-size: 12px;
    }

    .card-area {
      min-height: 310px;
    }

    .word-card,
    .ghost-card {
      min-height: 238px;
    }

    .word-card {
      padding: 14px 10px;
    }

    .sentence {
      font-size: 17px;
    }

    .full-word {
      font-size: 16px;
    }
  }

  @media (max-width: 480px) {
    .board {
      grid-template-columns: minmax(74px, 0.78fr) minmax(154px, 1.15fr) minmax(74px, 0.78fr);
    }

    .pile {
      min-height: 430px;
      padding: 8px;
    }

    .pile-name {
      display: none;
    }

    .masked-word {
      font-size: 42px;
    }

    .answer-pile .pile-letter {
      font-size: 30px;
    }
  }
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <h1>Vybrané slová</h1>
    <div class="stats" aria-live="polite">
      <div class="stat"><span id="round-progress">0/0</span></div>
      <div class="stat"><span id="score">0 správne</span></div>
      <button class="reset" type="button" id="reset-progress">Znova</button>
    </div>
  </header>

  <section class="board" aria-label="Triedenie kartičiek">
    <button class="pile answer-pile left" type="button" id="answer-i" aria-label="Vybrať i alebo í">
      <span>
        <span class="pile-letter">i / í</span>
        <span class="pile-name">ľavá kôpka</span>
      </span>
      <span class="pile-count"><span id="left-count">0</span> kariet</span>
    </button>

    <div class="pile source-pile" aria-live="polite">
      <span>
        <span class="pile-letter">karta</span>
        <span class="pile-name">stredná kôpka</span>
      </span>
      <div class="card-area">
        <div class="ghost-card" aria-hidden="true"></div>
        <article class="word-card" id="word-card">
          <div class="masked-word" id="masked-word">...</div>
          <p class="sentence" id="sentence">Načítavam kartičky.</p>
          <div class="full-word" id="full-word"></div>
        </article>
      </div>
      <span class="pile-count"><span id="remaining-count">0</span> v strede</span>
    </div>

    <button class="pile answer-pile right" type="button" id="answer-y" aria-label="Vybrať y alebo ý">
      <span>
        <span class="pile-letter">y / ý</span>
        <span class="pile-name">pravá kôpka</span>
      </span>
      <span class="pile-count"><span id="right-count">0</span> kariet</span>
    </button>
  </section>

  <div class="feedback" id="feedback">Vyber kôpku pre hornú kartu.</div>
</main>

<script src="./engine.js?v=3"></script>
<script>
const Engine = window.VybraneSlovaEngine;

const elements = {
  answerI: document.querySelector('#answer-i'),
  answerY: document.querySelector('#answer-y'),
  card: document.querySelector('#word-card'),
  maskedWord: document.querySelector('#masked-word'),
  sentence: document.querySelector('#sentence'),
  fullWord: document.querySelector('#full-word'),
  feedback: document.querySelector('#feedback'),
  roundProgress: document.querySelector('#round-progress'),
  score: document.querySelector('#score'),
  leftCount: document.querySelector('#left-count'),
  rightCount: document.querySelector('#right-count'),
  remainingCount: document.querySelector('#remaining-count'),
  resetProgress: document.querySelector('#reset-progress'),
};

function getStorage() {
  try {
    return window.localStorage;
  } catch (_error) {
    return null;
  }
}

const appStorage = getStorage();

const state = {
  cards: [],
  round: [],
  index: 0,
  correct: 0,
  chosenI: 0,
  chosenY: 0,
  locked: false,
  progress: Engine.loadProgress(appStorage),
};

const drag = {
  active: false,
  pointerId: null,
  source: null,
  startX: 0,
  startY: 0,
  lastX: 0,
  lastY: 0,
  startTime: 0,
  moved: false,
  lastPointerAt: 0,
};

function currentCard() {
  return state.round[state.index] || null;
}

function renderStats() {
  const total = state.round.length;
  elements.roundProgress.textContent = `${Math.min(state.index + 1, total)}/${total}`;
  elements.score.textContent = `${state.correct} správne`;
  elements.leftCount.textContent = state.chosenI;
  elements.rightCount.textContent = state.chosenY;
  elements.remainingCount.textContent = Math.max(total - state.index, 0);
}

function setFeedback(text, className = '') {
  elements.feedback.className = `feedback ${className}`.trim();
  elements.feedback.textContent = text;
}

function render() {
  const card = currentCard();
  const total = state.round.length;
  renderStats();

  if (!card) {
    elements.maskedWord.textContent = 'hotovo';
    elements.sentence.textContent = `Skóre ${state.correct}/${total}`;
    elements.fullWord.textContent = '';
    setFeedback('Kolo je hotové.', 'done');
    elements.answerI.disabled = true;
    elements.answerY.disabled = true;
    return;
  }

  elements.answerI.disabled = state.locked;
  elements.answerY.disabled = state.locked;
  elements.card.classList.remove('move-left', 'move-right');
  clearDragStyles();
  elements.maskedWord.textContent = card.masked_surface;
  elements.sentence.textContent = card.prompt_sentence;
  elements.fullWord.textContent = '';
}

function nextCard() {
  state.index++;
  state.locked = false;
  render();
  if (currentCard()) setFeedback('Vyber kôpku pre hornú kartu.');
}

function choose(answerGroup) {
  if (state.locked) return;
  const card = currentCard();
  if (!card) return;

  state.locked = true;
  drag.active = false;
  drag.source = null;
  clearTargetPile();
  elements.card.classList.remove('dragging');
  elements.answerI.disabled = true;
  elements.answerY.disabled = true;
  const isCorrect = Engine.checkAnswer(card, answerGroup);
  if (answerGroup === 'i') state.chosenI++;
  if (answerGroup === 'y') state.chosenY++;
  if (isCorrect) state.correct++;

  state.progress = Engine.recordAnswer(state.progress, card, isCorrect);
  Engine.saveProgress(state.progress, appStorage);

  elements.card.classList.add(answerGroup === 'i' ? 'move-left' : 'move-right');
  elements.fullWord.textContent = card.full_sentence;
  setFeedback(isCorrect ? `Správne: ${card.surface}` : `Patrí do ${card.answer_group === 'i' ? 'i/í' : 'y/ý'}: ${card.surface}`, isCorrect ? 'good' : 'needs-work');
  renderStats();
  window.setTimeout(nextCard, 980);
}

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function setCardDrag(dx, dy) {
  const rotation = clamp(dx / 18, -10, 10);
  elements.card.style.setProperty('--drag-x', `${dx}px`);
  elements.card.style.setProperty('--drag-y', `${dy}px`);
  elements.card.style.setProperty('--drag-rotate', `${rotation}deg`);
}

function clearDragStyles() {
  elements.card.classList.remove('dragging');
  elements.card.style.removeProperty('--drag-x');
  elements.card.style.removeProperty('--drag-y');
  elements.card.style.removeProperty('--drag-rotate');
}

function clearTargetPile() {
  elements.answerI.classList.remove('drop-target');
  elements.answerY.classList.remove('drop-target');
}

function setTargetPile(answerGroup) {
  elements.answerI.classList.toggle('drop-target', answerGroup === 'i');
  elements.answerY.classList.toggle('drop-target', answerGroup === 'y');
}

function targetFromPoint(clientX, clientY) {
  const element = document.elementFromPoint(clientX, clientY);
  if (element && elements.answerI.contains(element)) return 'i';
  if (element && elements.answerY.contains(element)) return 'y';
  return null;
}

function targetFromDrag(clientX, clientY, dx) {
  const overPile = targetFromPoint(clientX, clientY);
  if (overPile) return overPile;

  const elapsed = Math.max(1, performance.now() - drag.startTime);
  const velocityX = dx / elapsed;
  const threshold = Math.max(70, elements.card.offsetWidth * 0.34);
  const flickDistance = Math.max(46, elements.card.offsetWidth * 0.2);
  if (dx <= -threshold || (dx <= -flickDistance && velocityX <= -0.7)) return 'i';
  if (dx >= threshold || (dx >= flickDistance && velocityX >= 0.7)) return 'y';
  return null;
}

function snapCardBack() {
  drag.active = false;
  drag.source = null;
  clearTargetPile();
  elements.card.classList.remove('dragging');
  setCardDrag(0, 0);
  window.setTimeout(() => {
    if (!drag.active && !state.locked) clearDragStyles();
  }, 280);
}

function beginDrag(source, id, clientX, clientY) {
  drag.active = true;
  drag.pointerId = id;
  drag.source = source;
  drag.startX = clientX;
  drag.startY = clientY;
  drag.lastX = clientX;
  drag.lastY = clientY;
  drag.startTime = performance.now();
  drag.moved = false;
  elements.card.classList.add('dragging');
}

function updateDrag(clientX, clientY) {
  if (!drag.active || state.locked) return;

  drag.lastX = clientX;
  drag.lastY = clientY;
  const dx = clientX - drag.startX;
  const dy = clientY - drag.startY;
  if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
  setCardDrag(dx, dy);
  setTargetPile(targetFromDrag(clientX, clientY, dx));
}

function finishDrag(clientX, clientY) {
  const dx = clientX - drag.startX;
  const answerGroup = drag.moved ? targetFromDrag(clientX, clientY, dx) : null;
  if (answerGroup) {
    choose(answerGroup);
  } else {
    snapCardBack();
  }
}

function onPointerDown(event) {
  if (state.locked || drag.active || !currentCard()) return;
  if (event.pointerType === 'mouse' && event.button !== 0) return;

  drag.lastPointerAt = performance.now();
  beginDrag('pointer', event.pointerId, event.clientX, event.clientY);
  elements.card.setPointerCapture(event.pointerId);
  event.preventDefault();
}

function onPointerMove(event) {
  if (!drag.active || drag.source !== 'pointer' || event.pointerId !== drag.pointerId || state.locked) return;

  drag.lastPointerAt = performance.now();
  updateDrag(event.clientX, event.clientY);
  event.preventDefault();
}

function onPointerUp(event) {
  if (!drag.active || drag.source !== 'pointer' || event.pointerId !== drag.pointerId) return;

  drag.lastPointerAt = performance.now();
  if (elements.card.hasPointerCapture(event.pointerId)) {
    elements.card.releasePointerCapture(event.pointerId);
  }
  finishDrag(event.clientX, event.clientY);
  event.preventDefault();
}

function onPointerCancel(event) {
  if (!drag.active || drag.source !== 'pointer' || event.pointerId !== drag.pointerId) return;
  drag.lastPointerAt = performance.now();
  if (elements.card.hasPointerCapture(event.pointerId)) {
    elements.card.releasePointerCapture(event.pointerId);
  }
  snapCardBack();
}

function onMouseDown(event) {
  if (state.locked || drag.active || !currentCard() || event.button !== 0) return;
  if (performance.now() - drag.lastPointerAt < 500) return;

  beginDrag('mouse', 'mouse', event.clientX, event.clientY);
  event.preventDefault();
}

function onMouseMove(event) {
  if (!drag.active || drag.source !== 'mouse') return;

  updateDrag(event.clientX, event.clientY);
  event.preventDefault();
}

function onMouseUp(event) {
  if (!drag.active || drag.source !== 'mouse') return;

  finishDrag(event.clientX, event.clientY);
  event.preventDefault();
}

function firstTouch(event) {
  return event.changedTouches && event.changedTouches[0];
}

function onTouchStart(event) {
  if (state.locked || !currentCard() || drag.active) return;
  if (performance.now() - drag.lastPointerAt < 500) return;

  const touch = firstTouch(event);
  if (!touch) return;
  beginDrag('touch', touch.identifier, touch.clientX, touch.clientY);
  event.preventDefault();
}

function onTouchMove(event) {
  if (!drag.active || drag.source !== 'touch') return;

  const touch = Array.from(event.changedTouches || []).find(item => item.identifier === drag.pointerId);
  if (!touch) return;
  updateDrag(touch.clientX, touch.clientY);
  event.preventDefault();
}

function onTouchEnd(event) {
  if (!drag.active || drag.source !== 'touch') return;

  const touch = Array.from(event.changedTouches || []).find(item => item.identifier === drag.pointerId);
  if (!touch) return;
  finishDrag(touch.clientX, touch.clientY);
  event.preventDefault();
}

function onTouchCancel(event) {
  if (!drag.active || drag.source !== 'touch') return;
  snapCardBack();
  event.preventDefault();
}

function resetRound() {
  state.index = 0;
  state.correct = 0;
  state.chosenI = 0;
  state.chosenY = 0;
  state.locked = false;
  state.round = Engine.createRound(state.cards, { seed: Date.now() });
  elements.answerI.disabled = false;
  elements.answerY.disabled = false;
  render();
  setFeedback('Vyber kôpku pre hornú kartu.');
}

async function start() {
  try {
    const tsv = await fetch('./data/disambiguation.tsv').then(response => {
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.text();
    });
    state.cards = Engine.loadDisambiguationCards(tsv);
    state.round = Engine.createRound(state.cards, { seed: Date.now() });
    render();
    setFeedback('Vyber kôpku pre hornú kartu.');
  } catch (error) {
    elements.maskedWord.textContent = 'chyba';
    elements.sentence.textContent = 'Kartičky sa nenačítali.';
    setFeedback(error.message, 'needs-work');
  }
}

elements.answerI.addEventListener('click', () => choose('i'));
elements.answerY.addEventListener('click', () => choose('y'));
elements.resetProgress.addEventListener('click', resetRound);
elements.card.addEventListener('pointerdown', onPointerDown);
elements.card.addEventListener('pointermove', onPointerMove);
elements.card.addEventListener('pointerup', onPointerUp);
elements.card.addEventListener('pointercancel', onPointerCancel);
elements.card.addEventListener('mousedown', onMouseDown);
window.addEventListener('mousemove', onMouseMove);
window.addEventListener('mouseup', onMouseUp);
elements.card.addEventListener('touchstart', onTouchStart, { passive: false });
window.addEventListener('touchmove', onTouchMove, { passive: false });
window.addEventListener('touchend', onTouchEnd, { passive: false });
window.addEventListener('touchcancel', onTouchCancel, { passive: false });
window.addEventListener('keydown', event => {
  if (event.key === 'ArrowLeft') choose('i');
  if (event.key === 'ArrowRight') choose('y');
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js');
  });
}

start();
</script>
</body>
</html>
