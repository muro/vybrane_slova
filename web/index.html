<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3ebdd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vybrané slová">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Vybrané slová</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="preload" href="./fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Nunito variable, subset per Google Fonts unicode-range so Slovak diacritics
     load from latin-ext without pulling Cyrillic or Vietnamese. */
  @font-face {
    font-family: 'Nunito';
    font-style: normal;
    font-weight: 400 900;
    font-display: swap;
    src: url('./fonts/nunito-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  @font-face {
    font-family: 'Nunito';
    font-style: normal;
    font-weight: 400 900;
    font-display: swap;
    src: url('./fonts/nunito-latin-ext.woff2') format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }

  :root {
    color-scheme: light;
    --paper: #f3ebdd;
    --paper-top: #fcf7ee;
    --card: #fffcf5;
    --ink: #2a251d;
    --muted: #7b7060;
    --hairline: rgba(42, 37, 29, 0.1);
    --blue-strong: #2563b8;
    --gold-strong: #a8550c;
    --green-strong: #177245;
    --rose-strong: #a82f35;
    --card-w: min(344px, calc(100vw - 64px));
    --card-h: clamp(242px, 38dvh, 302px);
    --card-radius: 26px;
  }

  * { box-sizing: border-box; }

  html,
  body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Nunito', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow-x: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    min-height: 100dvh;
    background: radial-gradient(120% 74% at 50% 0%, var(--paper-top) 0%, var(--paper) 76%) fixed;
  }

  button {
    font: inherit;
  }

  .app {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 100vw;
    min-height: 100dvh;
    overflow: hidden;
    padding: calc(18px + env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    display: grid;
    grid-template-rows: auto 1fr;
    gap: 16px;
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    min-height: 40px;
  }

  .chrome-button,
  .letter-filter-button {
    min-height: 40px;
    border: 1px solid var(--hairline);
    background: rgba(255, 253, 246, 0.6);
    color: var(--muted);
    font-weight: 700;
  }

  .letter-filter {
    display: flex;
    flex: 1;
    gap: 4px;
    align-items: center;
    min-width: 0;
  }

  /* Seven letters share the top bar with the profile and about buttons, so
     they shrink to the space left over on narrow phones. */
  .letter-filter-button {
    --letter-size: clamp(26px, calc((100vw - 138px) / 7), 40px);
    width: var(--letter-size);
    min-width: 26px;
    height: var(--letter-size);
    min-height: 26px;
    padding: 0;
    border-radius: 50%;
    font: inherit;
    font-weight: 900;
    line-height: 1;
    cursor: pointer;
  }

  .letter-filter-button[aria-pressed="true"] {
    border-color: var(--blue-strong);
    background: var(--blue-strong);
    color: #fff;
    box-shadow: 0 4px 10px rgba(37, 99, 184, 0.25);
  }

  .chrome-button {
    min-width: 40px;
    padding: 8px 11px;
    border-radius: 999px;
    display: inline-grid;
    place-items: center;
    font-size: 18px;
    text-align: center;
    cursor: pointer;
  }

  .chrome-button:focus-visible,
  .letter-filter-button:focus-visible {
    outline: 3px solid rgba(37, 99, 184, 0.28);
    outline-offset: 2px;
  }

  .board {
    position: relative;
    width: min(620px, 100%);
    margin: 0 auto;
    display: grid;
    justify-items: center;
    align-content: center;
    gap: 20px;
  }

  .card-stage {
    position: relative;
    width: var(--card-w);
    height: var(--card-h);
    isolation: isolate;
  }

  /* The stack is material, not a queue: blank sheets give the active card a
     physical home without previewing another word or becoming a destination. */
  .card-stage::before,
  .card-stage::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    border: 1px solid rgba(112, 89, 55, 0.1);
    border-radius: var(--card-radius);
    background: linear-gradient(145deg, #fffef9, #f7efe3);
    box-shadow: 0 3px 0 #e8ddcd, 0 11px 22px -20px rgba(62, 46, 24, 0.75);
    pointer-events: none;
  }

  .card-stage::before {
    transform: translate(5px, 9px) rotate(0.45deg);
  }

  .card-stage::after {
    transform: translate(-3px, 4px) rotate(-0.3deg);
  }

  /* Answers slowly print a folk-flower field into the paper around the card.
     These belong to the current visit only, so a pale mistake never becomes a
     permanent mark. */
  .flower-garden {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .folk-flower {
    position: absolute;
    width: var(--flower-size, 64px);
    height: var(--flower-size, 64px);
    color: rgba(36, 92, 153, var(--flower-opacity, 0.28));
    transform: translate(-50%, -50%) rotate(var(--flower-turn, 0deg));
    animation: flower-pop 240ms cubic-bezier(0.18, 0.92, 0.32, 1.24) both;
  }

  .folk-flower.incorrect {
    color: rgba(161, 72, 70, var(--flower-opacity, 0.18));
  }

  .folk-flower__petal {
    position: absolute;
    left: 50%;
    top: 50%;
    width: var(--petal-width, 20%);
    height: var(--petal-height, 38%);
    border: 1.4px solid currentColor;
    border-radius: 60% 60% 48% 48%;
    transform-origin: 50% 100%;
    transform: translate(-50%, -100%) rotate(var(--petal-angle));
  }

  .folk-flower__core {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 18%;
    aspect-ratio: 1;
    border: 1.4px solid currentColor;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }

  .folk-flower--b { --petal-width: 24%; --petal-height: 36%; }
  .folk-flower--m { --petal-width: 17%; --petal-height: 42%; }
  .folk-flower--p { --petal-width: 23%; --petal-height: 35%; }
  .folk-flower--r { --petal-width: 13%; --petal-height: 44%; }
  .folk-flower--s { --petal-width: 20%; --petal-height: 31%; }
  .folk-flower--v { --petal-width: 16%; --petal-height: 40%; }
  .folk-flower--z { --petal-width: 21%; --petal-height: 33%; }

  .folk-flower--p .folk-flower__petal,
  .folk-flower--v .folk-flower__petal {
    border-radius: 100% 0 100% 0;
  }

  .folk-flower--s .folk-flower__petal {
    border-radius: 2px;
  }

  .folk-flower--r .folk-flower__petal {
    border-radius: 999px 999px 28% 28%;
  }

  @keyframes flower-pop {
    from {
      opacity: 0;
      transform: translate(-50%, -50%) rotate(var(--flower-turn, 0deg)) scale(0.62);
    }

    72% {
      opacity: 1;
      transform: translate(-50%, -50%) rotate(var(--flower-turn, 0deg)) scale(1.08);
    }

    to {
      opacity: 1;
      transform: translate(-50%, -50%) rotate(var(--flower-turn, 0deg)) scale(1);
    }
  }

  .word-card {
    position: absolute;
    inset: 0;
    z-index: 2;
    padding: 26px 22px;
    border-radius: var(--card-radius);
    border: 1px solid rgba(112, 89, 55, 0.12);
    background: linear-gradient(145deg, #fffef9 0%, var(--card) 58%, #f7efe3 100%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.96),
      inset 0 -3px 0 rgba(141, 112, 72, 0.07),
      0 3px 0 #ebe0d0,
      0 6px 0 #dacbb8,
      var(--shadow-x, 0px) calc(19px + var(--drag-lift, 0px)) calc(36px + var(--drag-lift, 0px)) -24px rgba(62, 46, 24, 0.48),
      var(--shadow-x, 0px) calc(38px + var(--drag-lift, 0px)) calc(64px + var(--drag-lift, 0px)) -36px rgba(62, 46, 24, 0.32);
    display: grid;
    align-content: center;
    gap: 16px;
    text-align: center;
    cursor: grab;
    touch-action: none;
    user-select: none;
    transform: translate(var(--drag-x, 0), var(--drag-y, 0)) rotate(var(--drag-rotate, 0deg)) scale(var(--drag-scale, 1));
    transition: transform 300ms cubic-bezier(0.2, 0.9, 0.25, 1.22), opacity 260ms ease;
    overflow: hidden;
  }

  /* A restrained sheen and visible paper edge make the card feel substantial,
     while still leaving the word as the only focus. */
  .word-card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background:
      linear-gradient(118deg, rgba(255, 255, 255, 0.7) 0%, rgba(255, 255, 255, 0.17) 27%, transparent 47%),
      linear-gradient(180deg, rgba(255, 255, 255, 0.22), transparent 34%);
    pointer-events: none;
  }

  .word-card.upcoming-card {
    z-index: 1;
    pointer-events: none;
    transform: translate(-3px, 4px) rotate(-0.3deg);
  }

  .outgoing-layer {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
  }

  .word-card.dragging {
    cursor: grabbing;
    transition: none;
  }

  .word-card.exit-wrong {
    animation: wrong-card-fade 1560ms ease forwards;
  }

  /* A wrong answer has one clear home for its correction: the departing card.
     It blushes first, leaving enough quiet time to read before the paper goes. */
  .word-card.outgoing-card.exit-wrong::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    border-radius: inherit;
    background:
      linear-gradient(145deg, rgba(255, 246, 241, 0.94), rgba(250, 219, 214, 0.95) 62%, rgba(238, 193, 186, 0.92)),
      var(--card);
    animation: wrong-card-blush 170ms ease-out forwards;
    pointer-events: none;
  }

  .word-card.outgoing-card.exit-wrong > * {
    position: relative;
    z-index: 1;
  }

  .word-card.outgoing-card.exit-wrong .masked-word {
    color: #7c3138;
  }

  .word-card.outgoing-card.exit-wrong .sentence {
    color: #805153;
  }

  .word-card.outgoing-card.exit-wrong .full-word {
    padding: 6px 10px;
    border-radius: 999px;
    background: rgba(255, 252, 248, 0.72);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
    color: var(--rose-strong);
    font-size: 20px;
    font-weight: 900;
  }

  @keyframes wrong-card-fade {
    0%, 65% {
      opacity: 1;
    }

    82%, 100% {
      opacity: 0;
      transform: translate(var(--drag-x, 0), var(--drag-y, 0)) scale(0.98);
    }
  }

  @keyframes wrong-card-blush {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .masked-word {
    font-size: clamp(46px, 8vw, 58px);
    line-height: 1.05;
    font-weight: 800;
    letter-spacing: -0.015em;
    white-space: nowrap;
  }

  /* At rest the gap is a soft tinted well rather than an underscore, so the card
     reads as a word waiting for a letter instead of broken text. */
  .letter-slot {
    display: inline-grid;
    min-width: 0.58em;
    min-height: 0.86em;
    margin: 0 0.04em;
    border-radius: 0.16em;
    background: rgba(42, 37, 29, 0.055);
    place-items: center;
    transition: background-color 140ms ease, color 140ms ease, box-shadow 140ms ease;
  }

  /* Two stages, both inside the word: a tinted preview while the card is still
     short of the submit distance, then solid colour once letting go will
     answer. That commit moment is the only cue, so it has to be unmissable. */
  .letter-slot.fill-i {
    background: rgba(37, 99, 184, 0.16);
    color: var(--blue-strong);
  }

  .letter-slot.fill-y {
    background: rgba(168, 85, 12, 0.16);
    color: var(--gold-strong);
  }

  .letter-slot.fill-i.ready {
    background: var(--blue-strong);
    color: #fff;
    box-shadow: 0 10px 22px -8px rgba(37, 99, 184, 0.55);
  }

  .letter-slot.fill-y.ready {
    background: var(--gold-strong);
    color: #fff;
    box-shadow: 0 10px 22px -8px rgba(168, 85, 12, 0.55);
  }

  .sentence {
    margin: 0;
    color: var(--muted);
    font-size: 19px;
    font-weight: 600;
    line-height: 1.4;
  }

  .sentence:empty {
    display: none;
  }

  .full-word {
    min-height: 1.5em;
    font-size: 17px;
    font-weight: 700;
    color: var(--muted);
  }

  .full-word.answer-i { color: var(--blue-strong); }

  .full-word.answer-y { color: var(--gold-strong); }

  .confetti-layer {
    position: absolute;
    inset: 0;
    overflow: visible;
    pointer-events: none;
    z-index: 4;
  }

  .confetti-piece {
    position: absolute;
    left: 50%;
    top: 48%;
    width: var(--confetti-width, 7px);
    height: var(--confetti-height, 11px);
    border-radius: 2px;
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.7) rotate(0deg);
    animation: confetti-pop 760ms cubic-bezier(0.16, 0.92, 0.32, 1) forwards;
    animation-delay: var(--confetti-delay, 0ms);
  }

  .card-effect-piece {
    position: absolute;
    left: var(--piece-left);
    top: var(--piece-top);
    pointer-events: none;
    will-change: transform, opacity;
  }

  .card-confetti-piece {
    width: var(--piece-width, 18px);
    height: var(--piece-height, 24px);
    opacity: 1;
    perspective: 600px;
    contain: layout paint;
    clip-path: var(--piece-clip, inset(0));
    transform: translate(-50%, -50%) scale(1) rotate(0deg);
    transform-style: preserve-3d;
    animation: card-tear-pop 700ms linear forwards;
    animation-delay: var(--piece-delay, 0ms);
  }

  .card-confetti-face {
    position: absolute;
    inset: 0;
    border-radius: 3px;
    overflow: hidden;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }

  .card-confetti-front {
    background: var(--card);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
    animation: tear-front-face 700ms linear forwards;
    animation-delay: var(--piece-delay, 0ms);
  }

  .card-confetti-rear {
    background-color: var(--piece-color);
    background-image: linear-gradient(120deg, rgba(255, 255, 255, 0.78) 0%, rgba(255, 255, 255, 0.14) 28%, transparent 49%);
    border: 1px solid rgba(255, 255, 255, 0.48);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.64), 0 3px 7px rgba(62, 46, 24, 0.16);
    opacity: 0;
    backface-visibility: visible;
    -webkit-backface-visibility: visible;
    animation: tear-rear-face 700ms linear forwards;
    animation-delay: var(--piece-delay, 0ms);
  }

  .tear-front-content {
    position: absolute;
    right: auto;
    bottom: auto;
    pointer-events: none;
  }

  .paper-strip {
    width: var(--piece-width);
    height: var(--piece-height);
    overflow: hidden;
    border: 1px solid rgba(168, 47, 53, 0.18);
    border-radius: 10px;
    background: var(--card);
    box-shadow: 0 12px 24px rgba(58, 43, 22, 0.12);
    opacity: 0;
    transform: translate(-50%, -50%) rotate(var(--piece-start-rotate, 0deg));
    animation: paper-strip-fall 880ms cubic-bezier(0.22, 0.62, 0.36, 1) forwards;
    animation-delay: var(--piece-delay, 0ms);
  }

  .paper-strip.diagonal-strip {
    clip-path: polygon(3% 0, 100% 0, 97% 100%, 0 100%);
  }

  .paper-strip::before,
  .paper-strip::after {
    content: "";
    position: absolute;
    left: 8px;
    right: 8px;
    z-index: 2;
    border-top: 1px dashed rgba(168, 47, 53, 0.18);
    pointer-events: none;
  }

  .paper-strip::before {
    top: 0;
  }

  .paper-strip::after {
    bottom: 0;
  }

  .paper-strip-card {
    position: absolute;
    left: 0;
    top: calc(-1 * var(--strip-offset));
    right: auto;
    bottom: auto;
    width: var(--card-width);
    min-height: var(--card-height);
    height: var(--card-height);
    box-shadow: none;
    transform: none !important;
    transition: none !important;
    pointer-events: none;
  }

  .paper-strip-card.wrong-paper-strip-card {
    left: var(--strip-card-left, 0px);
    background: linear-gradient(145deg, #fff6f1 0%, #faddd6 60%, #eec1ba 100%);
  }

  .paper-strip-card.wrong-paper-strip-card .masked-word {
    color: #7c3138;
  }

  .paper-strip-card.wrong-paper-strip-card .sentence {
    color: #805153;
  }

  .paper-strip-card.wrong-paper-strip-card .full-word {
    background: rgba(255, 252, 248, 0.72);
    color: var(--rose-strong);
  }

  @keyframes confetti-pop {
    12% {
      opacity: 1;
    }

    100% {
      opacity: 0;
      transform: translate(calc(-50% + var(--confetti-x)), calc(-50% + var(--confetti-y))) scale(1) rotate(var(--confetti-rotate));
    }
  }

  @keyframes card-tear-pop {
    0% {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1) rotate(0deg) rotateY(0deg);
    }

    24% {
      opacity: 1;
      transform: translate(calc(-50% + var(--piece-mid-x)), calc(-50% + var(--piece-mid-y))) scale(1.02) rotate(var(--piece-mid-rotate)) rotateY(var(--piece-mid-flip));
    }

    100% {
      opacity: 0;
      transform: translate(calc(-50% + var(--piece-x)), calc(-50% + var(--piece-y))) scale(0.7) rotate(var(--piece-rotate)) rotateY(var(--piece-flip));
    }
  }

  @keyframes tear-front-face {
    0%, 20% { opacity: 1; }
    34%, 100% { opacity: 0; }
  }

  @keyframes tear-rear-face {
    0%, 20% { opacity: 0; }
    34%, 100% { opacity: 1; }
  }

  @keyframes paper-strip-fall {
    0% {
      opacity: 0;
      transform: translate(-50%, -52%) rotate(var(--piece-start-rotate, 0deg));
    }

    12% {
      opacity: 1;
    }

    100% {
      opacity: 0;
      transform: translate(calc(-50% + var(--piece-x)), calc(-50% + var(--piece-y))) rotate(var(--piece-rotate));
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .card-confetti-piece,
    .paper-strip,
    .confetti-piece {
      animation-duration: 240ms;
    }

    .word-card.exit-wrong {
      animation-duration: 240ms;
    }

    .folk-flower {
      animation-duration: 120ms;
    }

  }

  .feedback {
    min-height: 1.5em;
    max-width: min(420px, 100%);
    margin: 0;
    padding: 0 10px;
    text-align: center;
    font-size: 17px;
    font-weight: 700;
    color: var(--muted);
    transition: opacity 200ms ease;
  }

  .feedback.good { color: var(--green-strong); }

  .feedback.needs-work { color: var(--rose-strong); }

  .feedback.done { color: var(--blue-strong); }

  .feedback.quiet {
    opacity: 0;
  }

  .sheet-overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
    display: grid;
    place-items: center;
    overflow-y: auto;
    background: rgba(58, 43, 22, 0.3);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
  }

  .sheet-overlay[hidden] {
    display: none;
  }

  .sheet {
    position: relative;
    width: min(340px, 100%);
    padding: 30px 24px 24px;
    border-radius: var(--card-radius);
    background: var(--card);
    box-shadow: 0 26px 60px -20px rgba(37, 34, 29, 0.38);
    text-align: center;
  }

  .sheet h2 {
    margin: 0;
    padding: 0 24px;
    font-size: 22px;
    line-height: 1.1;
    letter-spacing: 0;
  }

  .sheet p {
    margin: 14px 0 0;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.4;
  }

  .sheet a {
    color: var(--blue-strong);
    font-weight: 800;
    text-decoration: none;
  }

  .support-link,
  .primary-button {
    display: inline-block;
    margin-top: 22px;
    padding: 11px 20px;
    border: 0;
    border-radius: 999px;
    background: var(--blue-strong);
    color: #fff !important;
    box-shadow: 0 8px 18px rgba(37, 99, 184, 0.18);
  }

  .primary-button {
    min-width: 140px;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
  }

  .privacy-note {
    font-size: 12px !important;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .sheet-close {
    position: absolute;

<script>
const Engine = window.VybraneSlovaEngine;
const Avatars = window.VybraneSlovaAvatars;
const WRONG_STRIP_DELAY_MS = 1020;
const WRONG_OUTGOING_LIFETIME_MS = 2000;
const HIDDEN_AMBIGUOUS_ONLY = new URLSearchParams(window.location.search).get('cards') === 'ambiguous';

const elements = {
  card: document.querySelector('#word-card'),
  upcomingCard: document.querySelector('#upcoming-card'),
  outgoingLayer: document.querySelector('#outgoing-layer'),
  confettiLayer: document.querySelector('#confetti-layer'),
  maskedWord: document.querySelector('#masked-word'),
  upcomingMaskedWord: document.querySelector('#upcoming-masked-word'),
  sentence: document.querySelector('#sentence'),
  upcomingSentence: document.querySelector('#upcoming-sentence'),
  fullWord: document.querySelector('#full-word'),
  upcomingFullWord: document.querySelector('#upcoming-full-word'),
  feedback: document.querySelector('#feedback'),
  letterFilter: document.querySelector('#letter-filter'),
  aboutOpen: document.querySelector('#about-open'),
  aboutClose: document.querySelector('#about-close'),
  aboutOverlay: document.querySelector('#about-overlay'),
  aboutSheet: document.querySelector('#about-sheet'),
  profileOpen: document.querySelector('#profile-open'),
  profileClose: document.querySelector('#profile-close'),
  profileOverlay: document.querySelector('#profile-overlay'),
  profileSheet: document.querySelector('#profile-sheet'),
  profileTitle: document.querySelector('#profile-title'),
  profileList: document.querySelector('#profile-list'),
  profileForm: document.querySelector('#profile-form'),
  avatarPicker: document.querySelector('#avatar-picker'),
  profileName: document.querySelector('#profile-name'),
  profileBack: document.querySelector('#profile-back'),
  profileDelete: document.querySelector('#profile-delete'),
  profilePicker: document.querySelector('#profile-picker'),
  statsOpen: document.querySelector('#stats-open'),
  wordStats: document.querySelector('#word-stats'),
  statsLetters: document.querySelector('#stats-letters'),
  masteryGrid: document.querySelector('#mastery-grid'),
  statsWord: document.querySelector('#stats-word'),
  statsBack: document.querySelector('#stats-back'),
  flowerGarden: document.querySelector('#flower-garden'),
};

let confettiTimer = null;

function getStorage() {
  try {
    return window.localStorage;
  } catch (_error) {
    return null;
  }
}

const appStorage = getStorage();
const LETTER_ORDER = ['b', 'm', 'p', 'r', 's', 'v', 'z'];
const FLOWER_PETALS = { b: 5, m: 6, p: 4, r: 8, s: 6, v: 5, z: 7 };
const FLOWER_CANDIDATES = 42;
const FLOWER_TOP_CHOICES = 5;

function loadSettings(storage, profileId) {
  if (!storage) return { selectedLetters: null };
  try {
    const raw = storage.getItem(Engine.profileStorageKey(Engine.STORAGE_KEYS.settings, profileId));
    const saved = raw ? JSON.parse(raw) : {};
    const selectedLetters = Array.isArray(saved.selectedLetters)
      ? saved.selectedLetters.filter(letter => typeof letter === 'string')
      : null;
    return {
      selectedLetters,
    };
  } catch (_error) {
    return { selectedLetters: null };
  }
}

function saveSettings() {
  if (!appStorage) return;
  try {
    appStorage.setItem(Engine.profileStorageKey(Engine.STORAGE_KEYS.settings, state.profiles.activeId), JSON.stringify({
      selectedLetters: state.selectedLetters,
    }));
  } catch (_error) {
    // Practice should continue even if storage is unavailable.
  }
}

const initialProfiles = Engine.loadProfiles(appStorage, Avatars.AVATAR_KEYS);

const state = {
  cards: [],
  round: [],
  index: 0,
  locked: false,
  profiles: initialProfiles,
  selectedLetters: loadSettings(appStorage, initialProfiles.activeId).selectedLetters,
  progress: Engine.loadProgress(appStorage, initialProfiles.activeId),
};

const drag = {
  active: false,
  pointerId: null,
  source: null,
  startX: 0,
  startY: 0,
  lastX: 0,
  lastY: 0,
  startTime: 0,
  moved: false,
  hintAnswer: null,
  hintReady: false,
  lastPointerAt: 0,
};

function currentCard() {
  return state.round[state.index] || null;
}

function nextCardInRound() {
  return state.round[state.index + 1] || null;
}

function randomBetween(min, max) {
  return min + Math.random() * (max - min);
}

function viewportSize() {
  return {
    width: Math.max(1, window.innerWidth || document.documentElement.clientWidth || 1000),
    height: Math.max(1, window.innerHeight || document.documentElement.clientHeight || 1000),
  };
}

function randomFlowerSpot() {
  const { width, height } = viewportSize();
  const wideViewport = window.matchMedia && window.matchMedia('(min-width: 760px)').matches;
  const margin = wideViewport ? 58 : 18;
  const x = randomBetween(margin, Math.max(margin, width - margin));
  const y = randomBetween(margin, Math.max(margin, height - margin));
  return {
    left: (x / width) * 100,
    top: (y / height) * 100,
    size: Math.round(randomBetween(42, 72)),
  };
}

function pointForFlowerSpot(spot) {
  const { width, height } = viewportSize();
  return {
    x: (spot.left / 100) * width,
    y: (spot.top / 100) * height,
  };
}

function currentFlowerSpots() {
  return Array.from(elements.flowerGarden.querySelectorAll('.folk-flower'))
    .map(flower => ({
      left: Number(flower.dataset.flowerLeft),
      top: Number(flower.dataset.flowerTop),
    }))
    .filter(spot => Number.isFinite(spot.left) && Number.isFinite(spot.top));
}

function nearestFlowerDistance(spot, existingSpots) {
  if (!existingSpots.length) return Infinity;
  const { width, height } = viewportSize();
  return Math.min(...existingSpots.map(existing => {
    const dx = ((spot.left - existing.left) / 100) * width;
    const dy = ((spot.top - existing.top) / 100) * height;
    return Math.hypot(dx, dy);
  }));
}

function protectedFlowerRects() {
  return [
    { selector: '.card-stage', mode: 'half-visible' },
    { selector: '.topbar', mode: 'avoid' },
    { selector: '.feedback', mode: 'avoid' },
  ]
    .map(item => ({
      ...item,
      rect: document.querySelector(item.selector)?.getBoundingClientRect(),
    }))
    .filter(item => item.rect && item.rect.width > 0 && item.rect.height > 0);
}

function distanceToRect(point, rect) {
  const dx = Math.max(rect.left - point.x, 0, point.x - rect.right);
  const dy = Math.max(rect.top - point.y, 0, point.y - rect.bottom);
  return Math.hypot(dx, dy);
}

function pointInRect(point, rect) {
  return point.x >= rect.left && point.x <= rect.right && point.y >= rect.top && point.y <= rect.bottom;
}

function flowerProtectedPenalty(spot, rects) {
  const point = pointForFlowerSpot(spot);
  const radius = spot.size * 0.56;
  for (const item of rects) {
    if (item.mode === 'half-visible') {
      if (pointInRect(point, item.rect)) return -10000;
      continue;
    }

    const distance = distanceToRect(point, item.rect);
    if (distance < radius + 12) return -10000;
  }
  return 0;
}

function flowerEdgeDistance(spot) {
  const point = pointForFlowerSpot(spot);
  const { width, height } = viewportSize();
  return Math.min(point.x, width - point.x, point.y, height - point.y);
}

function scoreFlowerSpot(spot, existingSpots, protectedRects) {
  const nearest = existingSpots.length ? nearestFlowerDistance(spot, existingSpots) : 260;
  const spread = Math.min(nearest, 430);
  const interior = Math.min(flowerEdgeDistance(spot), 170) * 0.72;
  return spread + interior + flowerProtectedPenalty(spot, protectedRects) + Math.random() * 34;
}

function chooseFlowerSpot() {
  const existingSpots = currentFlowerSpots();
  const protectedRects = protectedFlowerRects();
  const candidates = Array.from({ length: FLOWER_CANDIDATES }, randomFlowerSpot)
    .map(spot => ({
      ...spot,
      score: scoreFlowerSpot(spot, existingSpots, protectedRects),
    }))
    .filter(spot => spot.score > -1000)
    .sort((a, b) => b.score - a.score);
  if (!candidates.length) return randomFlowerSpot();
  const topChoices = candidates.slice(0, Math.min(FLOWER_TOP_CHOICES, candidates.length));
  const choiceIndex = Math.floor(Math.pow(Math.random(), 1.35) * topChoices.length);
  return topChoices[choiceIndex];
}

function addBackgroundFlower(card, isCorrect) {
  const spot = chooseFlowerSpot();
  const letter = FLOWER_PETALS[card.selected_letter] ? card.selected_letter : 'b';
  const flower = document.createElement('div');
  flower.className = `folk-flower folk-flower--${letter}${isCorrect ? '' : ' incorrect'}`;
  flower.style.left = `${spot.left.toFixed(2)}%`;
  flower.style.top = `${spot.top.toFixed(2)}%`;
  flower.style.setProperty('--flower-size', `${spot.size}px`);
  flower.style.setProperty('--flower-turn', `${Math.round(Math.random() * 360)}deg`);
  flower.dataset.flowerLeft = String(spot.left);
  flower.dataset.flowerTop = String(spot.top);
  flower.dataset.opacity = String(isCorrect ? 0.31 : 0.19);
  flower.style.setProperty('--flower-opacity', flower.dataset.opacity);

  const petals = FLOWER_PETALS[letter];
  for (let index = 0; index < petals; index++) {
    const petal = document.createElement('span');
    petal.className = 'folk-flower__petal';
    petal.style.setProperty('--petal-angle', `${index * (360 / petals)}deg`);
    flower.append(petal);
  }

  const core = document.createElement('span');
  core.className = 'folk-flower__core';
  flower.append(core);

  elements.flowerGarden.querySelectorAll('.folk-flower').forEach(existing => {
    const nextOpacity = Math.max(0.07, Number(existing.dataset.opacity) - 0.012);
    existing.dataset.opacity = String(nextOpacity);
    existing.style.setProperty('--flower-opacity', nextOpacity);
  });
  elements.flowerGarden.append(flower);
  if (elements.flowerGarden.childElementCount > 40) {
    elements.flowerGarden.firstElementChild.remove();
  }
}

function cardsForSelectedLetters() {
  return Engine.filterCardsByLetters(state.cards, state.selectedLetters);
}

function createCurrentRound() {
  return Engine.createRound(cardsForSelectedLetters(), { seed: Date.now() });
}

function populateLetterFilter() {
  const available = new Set(state.cards.map(card => card.selected_letter).filter(Boolean));
  const letters = LETTER_ORDER.filter(letter => available.has(letter));
  state.selectedLetters = Array.isArray(state.selectedLetters)
    ? state.selectedLetters.filter(letter => available.has(letter))
    : letters.slice();

  elements.letterFilter.textContent = '';
  for (const letter of letters) {
    const button = document.createElement('button');
    button.className = 'letter-filter-button';
    button.type = 'button';
    button.dataset.letter = letter;
    button.textContent = letter;
    button.setAttribute('aria-pressed', String(state.selectedLetters.includes(letter)));
    elements.letterFilter.append(button);
  }
}

function updateLetterFilter() {
  elements.letterFilter.querySelectorAll('.letter-filter-button').forEach(button => {
    button.setAttribute('aria-pressed', String(state.selectedLetters.includes(button.dataset.letter)));
  });
}

function setFeedback(text, className = '') {
  elements.feedback.className = `feedback ${className}`.trim();
  elements.feedback.textContent = text;
}

function clearConfetti() {
  if (confettiTimer) {
    window.clearTimeout(confettiTimer);
    confettiTimer = null;
  }
  elements.confettiLayer.textContent = '';
}

function cardBoxInEffectLayer(card) {
  const cardRect = card.getBoundingClientRect();
  const layerRect = elements.confettiLayer.getBoundingClientRect();
  return {
    left: cardRect.left - layerRect.left,
    top: cardRect.top - layerRect.top,
    width: cardRect.width,
    height: cardRect.height,
  };
}

function addEffectPiece(className, left, top, customProperties = {}, parent = elements.confettiLayer) {
  const piece = document.createElement('div');
  piece.className = `card-effect-piece ${className}`;
  piece.style.setProperty('--piece-left', `${left}px`);
  piece.style.setProperty('--piece-top', `${top}px`);
  for (const [name, value] of Object.entries(customProperties)) {
    piece.style.setProperty(name, value);
  }
  parent.append(piece);
  return piece;
}

function showCardTear(answerGroup, card) {
  const answerColors = answerGroup === 'i'
    ? ['#2563b8', '#4e9ce5', '#7c5ce7']
    : ['#e59524', '#f6bd45', '#ef6a56'];
  const colors = [...answerColors, '#20a565', '#e3477a', '#25abc6', '#9b61db'];
  const box = cardBoxInEffectLayer(card);
  const cardStyle = getComputedStyle(card);
  const centerX = box.left + box.width / 2;
  const centerY = box.top + box.height / 2;
  clearConfetti();

  const pieces = document.createDocumentFragment();
  const tearShapes = [
    'polygon(2% 14%, 62% 0, 100% 18%, 91% 100%, 24% 94%, 0 58%)',
    'polygon(14% 0, 93% 6%, 100% 66%, 72% 100%, 10% 86%, 0 28%)',
    'polygon(0 17%, 51% 0, 100% 22%, 84% 100%, 20% 94%)',
    'polygon(9% 0, 100% 13%, 82% 70%, 54% 100%, 0 88%, 7% 46%)',
    'polygon(0 0, 81% 8%, 100% 55%, 67% 100%, 5% 83%, 16% 35%)',
    'polygon(21% 0, 100% 12%, 88% 83%, 41% 100%, 0 65%, 8% 20%)',
  ];
  // Irregular pieces overlap slightly at release, avoiding a visible grid
  // while keeping the short animation light enough for phone hardware.
  const columns = 8;
  const rows = 8;
  const cellWidth = box.width / columns;
  const cellHeight = box.height / rows;
  const width = cellWidth * 1.35;
  const height = cellHeight * 1.35;
  for (let index = 0; index < columns * rows; index++) {
    const column = index % columns;
    const row = Math.floor(index / columns);
    const sourceLeft = column * cellWidth - (width - cellWidth) / 2;
    const sourceTop = row * cellHeight - (height - cellHeight) / 2;
    const left = box.left + sourceLeft + width / 2;
    const top = box.top + sourceTop + height / 2;
    const fromCenterX = left - centerX;
    const fromCenterY = top - centerY;
    const angle = Math.atan2(fromCenterY, fromCenterX) + (-0.8 + Math.random() * 1.6);
    const distance = 86 + Math.random() * 148;
    const rotation = -320 + Math.random() * 640;
    const flip = 180 + Math.random() * 120;
    const piece = addEffectPiece('card-confetti-piece', left, top, {
      '--piece-x': `${Math.cos(angle) * distance}px`,
      '--piece-y': `${Math.sin(angle) * distance - 34 - Math.random() * 42}px`,
      '--piece-mid-x': `${Math.cos(angle) * distance * 0.56}px`,
      '--piece-mid-y': `${Math.sin(angle) * distance * 0.56 - 18}px`,
      '--piece-rotate': `${rotation}deg`,
      '--piece-mid-rotate': `${rotation * 0.54}deg`,
      '--piece-flip': `${flip}deg`,
      '--piece-mid-flip': `${flip * 0.62}deg`,
      '--piece-delay': '0ms',
      '--piece-width': `${width}px`,
      '--piece-height': `${height}px`,
      '--piece-clip': tearShapes[(index + Math.floor(Math.random() * tearShapes.length)) % tearShapes.length],
      '--piece-color': colors[index % colors.length],
    }, pieces);
    const front = document.createElement('div');
    front.className = 'card-confetti-face card-confetti-front';
    const content = document.createElement('div');
    content.className = 'tear-front-content';
    content.style.left = `${-sourceLeft}px`;
    content.style.top = `${-sourceTop}px`;
    content.style.width = `${box.width}px`;
    content.style.height = `${box.height}px`;
    content.style.padding = cardStyle.padding;
    content.style.display = 'grid';
    content.style.alignContent = 'center';
    content.style.gap = cardStyle.gap;
    content.style.textAlign = 'center';
    ['.masked-word', '.sentence', '.full-word'].forEach(selector => {
      const source = card.querySelector(selector);
      if (source) content.append(source.cloneNode(true));
    });
    front.append(content);
    const rear = document.createElement('div');
    rear.className = 'card-confetti-face card-confetti-rear';
    piece.append(front, rear);
  }

  elements.confettiLayer.append(pieces);

  confettiTimer = window.setTimeout(clearConfetti, 1280);
}

function showWrongFallApart(card) {
  const box = cardBoxInEffectLayer(card);
  const strips = 6;
  clearConfetti();

  for (let index = 0; index < strips; index++) {
    const stripHeight = box.height / strips;
    const stripRotation = (index % 2 === 0 ? -14 : 9) + Math.random() * 4;
    const left = box.left + box.width / 2 + (-7 + Math.random() * 14);
    const top = box.top + stripHeight * (index + 0.5);
    const piece = addEffectPiece('paper-strip diagonal-strip', left, top, {
      '--piece-width': `${box.width + 42}px`,
      '--piece-height': `${Math.max(32, stripHeight + 9)}px`,
      '--card-width': `${box.width}px`,
      '--card-height': `${box.height}px`,
      '--strip-offset': `${stripHeight * index}px`,
      '--strip-card-left': '-21px',
      '--piece-x': `${-78 + Math.random() * 156}px`,
      '--piece-y': `${204 + index * 29 + Math.random() * 54}px`,
      '--piece-rotate': `${stripRotation + (-15 + Math.random() * 30)}deg`,
      '--piece-start-rotate': `${stripRotation}deg`,
      '--piece-delay': `${WRONG_STRIP_DELAY_MS + index * 36}ms`,
    });
    const cardSlice = card.cloneNode(true);
    cardSlice.removeAttribute('id');
    cardSlice.classList.remove('dragging', 'exit-correct', 'exit-wrong');
    cardSlice.classList.add('paper-strip-card', 'wrong-paper-strip-card');
    cardSlice.querySelectorAll('[id]').forEach(node => node.removeAttribute('id'));
    piece.append(cardSlice);
  }

  confettiTimer = window.setTimeout(clearConfetti, WRONG_OUTGOING_LIFETIME_MS);
}

function letterForAnswer(card, answerGroup) {
  const maskIndex = card.masked_surface.indexOf('_');
  const correctLetter = maskIndex >= 0 ? card.surface[maskIndex] : '';
  const isLong = correctLetter === 'í' || correctLetter === 'ý';
  if (answerGroup === 'i') return isLong ? 'í' : 'i';
  if (answerGroup === 'y') return isLong ? 'ý' : 'y';
  return '';
}

function setReveal(text, answerGroup) {
  elements.fullWord.className = `full-word${answerGroup ? ` answer-${answerGroup}` : ''}`;
  elements.fullWord.textContent = text;
}

function renderMaskedWordInto(target, card, answerGroup = null) {
  target.textContent = '';
  const maskIndex = card.masked_surface.indexOf('_');
  if (maskIndex < 0) {
    target.textContent = card.masked_surface;
    return null;
  }

  target.append(document.createTextNode(card.masked_surface.slice(0, maskIndex)));
  const slot = document.createElement('span');
  slot.className = `letter-slot${answerGroup ? ` fill-${answerGroup}` : ''}${answerGroup && drag.hintReady ? ' ready' : ''}`;
  slot.textContent = letterForAnswer(card, answerGroup);
  target.append(slot);
  target.append(document.createTextNode(card.masked_surface.slice(maskIndex + 1)));
  return slot;
}

function renderMaskedWord(card, answerGroup = null) {
  elements.letterSlot = renderMaskedWordInto(elements.maskedWord, card, answerGroup);
}

function renderUpcomingCard() {
  const card = nextCardInRound();
  elements.upcomingCard.hidden = !card;
  if (!card) return;

  renderMaskedWordInto(elements.upcomingMaskedWord, card);
  elements.upcomingSentence.textContent = card.prompt_sentence;
  elements.upcomingFullWord.textContent = '';
}

function render() {
  const card = currentCard();
  const total = state.round.length;
  renderUpcomingCard();

  elements.card.classList.remove('exit-wrong');
  clearDragStyles();

  if (!card) {
    if (!total) {
      elements.maskedWord.textContent = 'vyber písmeno';
      elements.sentence.textContent = 'Ťukni na písmeno hore.';
      setReveal('', null);
      setFeedback('', 'quiet');
      return;
    }
    elements.maskedWord.textContent = 'hotovo';
    elements.sentence.textContent = 'Kolo je hotové.';
    setReveal('', null);
    setFeedback('Kolo je hotové.', 'done');
    return;
  }

  renderMaskedWord(card);
  elements.sentence.textContent = card.prompt_sentence;
  setReveal('', null);
}

function advanceToNextCard() {
  state.index++;
  state.locked = false;
  render();
  if (currentCard()) setFeedback('', 'quiet');
}

function moveCurrentCardToOutgoingLayer(lifetime = 1200) {
  const outgoing = elements.card.cloneNode(true);
  outgoing.removeAttribute('id');
  outgoing.classList.remove('dragging');
  outgoing.classList.add('outgoing-card');
  outgoing.querySelectorAll('[id]').forEach(node => node.removeAttribute('id'));
  elements.outgoingLayer.append(outgoing);
  window.setTimeout(() => outgoing.remove(), lifetime);
  return outgoing;
}

function choose(answerGroup) {
  if (state.locked) return;
  const card = currentCard();
  if (!card) return;

  state.locked = true;
  drag.active = false;
  drag.source = null;
  elements.card.classList.remove('dragging');
  const isCorrect = Engine.checkAnswer(card, answerGroup);

  state.progress = Engine.recordAnswer(state.progress, card, isCorrect);
  Engine.saveProgress(state.progress, appStorage, state.profiles.activeId);
  addBackgroundFlower(card, isCorrect);

  // The outgoing card is the one place that reveals the correction. Keeping
  // the feedback line quiet avoids repeating the same message underneath it.
  setDragHint(isCorrect ? answerGroup : card.answer_group, true);
  setReveal(isCorrect ? '' : `správne: ${card.surface}`, isCorrect ? null : card.answer_group);
  setFeedback('', 'quiet');

  if (isCorrect) {
    // Build a full tiled copy before rendering the next card. The old card is
    // never left on screen to fade: its printed front is the initial state of
    // the pieces, so the tear begins on the release frame.
    showCardTear(answerGroup, elements.card);
  } else {
    const outgoing = moveCurrentCardToOutgoingLayer(WRONG_OUTGOING_LIFETIME_MS);
    outgoing.classList.add('exit-wrong');
    showWrongFallApart(outgoing);
  }
  advanceToNextCard();
}

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function submitThreshold() {
  return Math.max(72, Math.min(108, elements.card.offsetWidth * 0.28));
}

function resistedDistance(distance) {
  const freeTravel = Math.min(42, elements.card.offsetWidth * 0.13);
  const maximum = Math.min(78, elements.card.offsetWidth * 0.23);
  const extraTravel = Math.max(0, Math.abs(distance) - freeTravel);
  const resistance = Math.max(54, elements.card.offsetWidth * 0.2);
  const resistedTravel = maximum - freeTravel;
  const visualDistance = Math.abs(distance) <= freeTravel
    ? Math.abs(distance)
    : freeTravel + resistedTravel * (1 - Math.exp(-extraTravel / resistance));
  return Math.sign(distance) * visualDistance;
}

function setCardDrag(dx, dy) {
  const visualX = resistedDistance(dx);
  const visualY = clamp(dy * 0.08, -12, 12);
  const pull = Math.min(1, Math.abs(visualX) / Math.max(1, elements.card.offsetWidth * 0.23));
  const rotation = clamp(visualX / 44, -1.7, 1.7);
  elements.card.style.setProperty('--drag-x', `${visualX}px`);
  elements.card.style.setProperty('--drag-y', `${visualY}px`);
  elements.card.style.setProperty('--drag-rotate', `${rotation}deg`);
  elements.card.style.setProperty('--drag-scale', String(1 + pull * 0.008));
  elements.card.style.setProperty('--drag-lift', `${Math.round(pull * 9)}px`);
  elements.card.style.setProperty('--shadow-x', `${Math.round(-visualX * 0.11)}px`);
  const ready = Math.abs(dx) >= submitThreshold();
  if (dx < -22) {
    setDragHint('i', ready);
  } else if (dx > 22) {
    setDragHint('y', ready);
  } else {
    setDragHint(null, false);
  }
}

// All drag feedback lives inside the word: the blank previews the letter in its
// answer colour, and turns solid once the card has moved far enough to submit.
function setDragHint(answerGroup, ready = false) {
  if (drag.hintAnswer === answerGroup && drag.hintReady === ready) return;
  const answerChanged = drag.hintAnswer !== answerGroup;
  drag.hintAnswer = answerGroup;
  drag.hintReady = ready;

  const card = currentCard();
  if (!card) return;
  if (answerChanged) {
    renderMaskedWord(card, answerGroup);
  } else if (elements.letterSlot) {
    elements.letterSlot.classList.toggle('ready', ready);
  }
}

function clearDragStyles() {
  elements.card.classList.remove('dragging');
  drag.hintAnswer = null;
  drag.hintReady = false;
  elements.card.style.removeProperty('--drag-x');
  elements.card.style.removeProperty('--drag-y');
  elements.card.style.removeProperty('--drag-rotate');
  elements.card.style.removeProperty('--drag-scale');
  elements.card.style.removeProperty('--drag-lift');
  elements.card.style.removeProperty('--shadow-x');
}

function targetFromDrag(dx) {
  const threshold = submitThreshold();
  if (dx <= -threshold) return 'i';
  if (dx >= threshold) return 'y';
  return null;
}

function snapCardBack() {
  drag.active = false;
  drag.source = null;
  elements.card.classList.remove('dragging');
  setCardDrag(0, 0);
  window.setTimeout(() => {
    if (!drag.active && !state.locked) clearDragStyles();
  }, 280);
}

// On load the card demonstrates a short tug toward each answer, filling the
// letter slot each way, then springs back. Any real input cancels it, so it
// never fights the child for control of the card.
let introTimers = [];

function cancelIntro() {
  if (!introTimers.length) return;
  introTimers.forEach(window.clearTimeout);
  introTimers = [];
  clearDragStyles();
}

function runIntro() {
  if (!currentCard()) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const reach = () => Math.round(submitThreshold() * 1.08);
  const at = (delay, step) => introTimers.push(window.setTimeout(step, delay));

  at(460, () => setCardDrag(-reach(), 0));
  at(1200, () => setCardDrag(reach(), 0));
  at(1940, () => setCardDrag(0, 0));
  at(2260, () => {
    introTimers = [];
    clearDragStyles();
  });
}

function beginDrag(source, id, clientX, clientY) {
  drag.active = true;
  drag.pointerId = id;
  drag.source = source;
  drag.startX = clientX;
  drag.startY = clientY;
  drag.lastX = clientX;
  drag.lastY = clientY;
  drag.startTime = performance.now();
  drag.moved = false;
  drag.hintAnswer = null;
  elements.card.classList.add('dragging');
}

function updateDrag(clientX, clientY) {
  if (!drag.active || state.locked) return;

  drag.lastX = clientX;
  drag.lastY = clientY;
  const dx = clientX - drag.startX;
  const dy = clientY - drag.startY;
  if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
  setCardDrag(dx, dy);
}

function finishDrag(clientX, clientY) {
  const dx = clientX - drag.startX;
  const wasMoved = drag.moved;
  const answerGroup = wasMoved ? targetFromDrag(dx) : null;
  if (answerGroup) {
    choose(answerGroup);
  } else {
    snapCardBack();
    if (wasMoved) setFeedback('Potiahni viac do strany.');
  }
}

function onPointerDown(event) {
  if (state.locked || drag.active || !currentCard()) return;
  if (event.pointerType === 'mouse' && event.button !== 0) return;

  drag.lastPointerAt = performance.now();
  cancelIntro();
  beginDrag('pointer', event.pointerId, event.clientX, event.clientY);
  elements.card.setPointerCapture(event.pointerId);
  event.preventDefault();
}

function onPointerMove(event) {
  if (!drag.active || drag.source !== 'pointer' || event.pointerId !== drag.pointerId || state.locked) return;

  drag.lastPointerAt = performance.now();
  updateDrag(event.clientX, event.clientY);
  event.preventDefault();
}

function onPointerUp(event) {
  if (!drag.active || drag.source !== 'pointer' || event.pointerId !== drag.pointerId) return;

  drag.lastPointerAt = performance.now();
  if (elements.card.hasPointerCapture(event.pointerId)) {
    elements.card.releasePointerCapture(event.pointerId);
  }
  finishDrag(event.clientX, event.clientY);
  event.preventDefault();
}

function onPointerCancel(event) {
  if (!drag.active || drag.source !== 'pointer' || event.pointerId !== drag.pointerId) return;
  drag.lastPointerAt = performance.now();
  if (elements.card.hasPointerCapture(event.pointerId)) {
    elements.card.releasePointerCapture(event.pointerId);
  }
  snapCardBack();
}

function onMouseDown(event) {
  if (state.locked || drag.active || !currentCard() || event.button !== 0) return;
  if (performance.now() - drag.lastPointerAt < 500) return;

  cancelIntro();
  beginDrag('mouse', 'mouse', event.clientX, event.clientY);
  event.preventDefault();
}

function onMouseMove(event) {
  if (!drag.active || drag.source !== 'mouse') return;

  updateDrag(event.clientX, event.clientY);
  event.preventDefault();
}

function onMouseUp(event) {
  if (!drag.active || drag.source !== 'mouse') return;

  finishDrag(event.clientX, event.clientY);
  event.preventDefault();
}

function firstTouch(event) {
  return event.changedTouches && event.changedTouches[0];
}

function onTouchStart(event) {
  if (state.locked || !currentCard() || drag.active) return;
  if (performance.now() - drag.lastPointerAt < 500) return;

  const touch = firstTouch(event);
  if (!touch) return;
  cancelIntro();
  beginDrag('touch', touch.identifier, touch.clientX, touch.clientY);
  event.preventDefault();
}

function onTouchMove(event) {
  if (!drag.active || drag.source !== 'touch') return;

  const touch = Array.from(event.changedTouches || []).find(item => item.identifier === drag.pointerId);
  if (!touch) return;
  updateDrag(touch.clientX, touch.clientY);
  event.preventDefault();
}

function onTouchEnd(event) {
  if (!drag.active || drag.source !== 'touch') return;

  const touch = Array.from(event.changedTouches || []).find(item => item.identifier === drag.pointerId);
  if (!touch) return;
  finishDrag(touch.clientX, touch.clientY);
  event.preventDefault();
}

function onTouchCancel(event) {
  if (!drag.active || drag.source !== 'touch') return;
  snapCardBack();
  event.preventDefault();
}

// Profiles let several children share one device. Each child keeps their own
// progress and letter choice; the background flowers belong to whoever is
// practicing now, so switching starts a fresh field.
const PENCIL_ICON = '<svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M11.2 2.2l2.6 2.6-8 8-3.3.7.7-3.3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>';

const profileSheet = {
  editingId: null,
  avatar: Avatars.AVATAR_KEYS[0],
  confirmingDelete: false,
  statsLetter: null,
};

function profileDisplayName(profile) {
  return profile.name || Engine.normalizeProfileName(Avatars.avatarByKey(profile.avatar).label);
}

function avatarBadge(avatar, tagName = 'span') {
  const badge = document.createElement(tagName);
  badge.className = 'avatar-badge';
  badge.style.background = avatar.background;
  badge.innerHTML = Avatars.avatarSvg(avatar);
  return badge;
}

function renderProfileButton() {
  const profile = Engine.activeProfile(state.profiles);
  const avatar = profile ? Avatars.avatarByKey(profile.avatar) : Avatars.GUEST;
  elements.profileOpen.innerHTML = Avatars.avatarSvg(avatar);
  elements.profileOpen.style.background = avatar.background;
  elements.profileOpen.setAttribute('aria-label', profile ? `Profil: ${profileDisplayName(profile)}` : 'Vybrať profil');
}

function applyActiveProfile() {
  const profileId = state.profiles.activeId;
  state.selectedLetters = loadSettings(appStorage, profileId).selectedLetters;
  state.progress = Engine.loadProgress(appStorage, profileId);
  elements.flowerGarden.textContent = '';
  renderProfileButton();
  if (!state.cards.length) return;
  populateLetterFilter();
  resetRound();
  const profile = Engine.activeProfile(state.profiles);
  if (profile && currentCard()) setFeedback(`Ahoj, ${profileDisplayName(profile)}!`, 'done');
}

function saveProfilesAndApply() {
  Engine.saveProfiles(state.profiles, appStorage);
  applyActiveProfile();
}

// The sheet swaps views in place. Each view's show function then moves focus
// into it, so focus never stays on a button that has just been hidden.
function showProfileView(view, title) {
  elements.profileTitle.textContent = title;
  elements.profilePicker.hidden = view !== 'picker';
  elements.profileForm.hidden = view !== 'form';
  elements.wordStats.hidden = view !== 'stats';
}

function showProfilePicker() {
  showProfileView('picker', 'Ahoj, kto si?');
  elements.profileList.textContent = '';
  for (const profile of state.profiles.profiles) {
    const item = document.createElement('li');
    item.className = 'profile-item';
    const choice = document.createElement('button');
    choice.className = 'profile-choice';
    choice.type = 'button';
    choice.dataset.profileId = profile.id;
    choice.setAttribute('aria-pressed', String(profile.id === state.profiles.activeId));
    const name = document.createElement('span');
    name.className = 'profile-name';
    name.textContent = profileDisplayName(profile);
    choice.append(avatarBadge(Avatars.avatarByKey(profile.avatar)), name);
    const edit = document.createElement('button');
    edit.className = 'profile-edit';
    edit.type = 'button';
    edit.dataset.editId = profile.id;
    edit.setAttribute('aria-label', `Upraviť ${profileDisplayName(profile)}`);
    edit.innerHTML = PENCIL_ICON;
    item.append(choice, edit);
    elements.profileList.append(item);
  }

  const addItem = document.createElement('li');
  const add = document.createElement('button');
  add.className = 'profile-choice profile-add';
  add.type = 'button';
  add.dataset.add = 'true';
  const plus = document.createElement('span');
  plus.className = 'avatar-badge';
  plus.textContent = '+';
  const label = document.createElement('span');
  label.className = 'profile-name';
  label.textContent = 'Pridať';
  add.append(plus, label);
  addItem.append(add);
  elements.profileList.append(addItem);
  (elements.profileList.querySelector('.profile-choice[aria-pressed="true"]') || add).focus();
}

// A radio group is one tab stop; arrow keys move the choice.
function setFormAvatar(key) {
  profileSheet.avatar = key;
  elements.avatarPicker.querySelectorAll('.avatar-option').forEach(option => {
    const checked = option.dataset.avatar === key;
    option.setAttribute('aria-checked', String(checked));
    option.tabIndex = checked ? 0 : -1;
  });
  elements.profileName.placeholder = Engine.normalizeProfileName(Avatars.avatarByKey(key).label);
}

// Pictures come first and the name field is not focused automatically, so
// a phone keyboard never covers the animals before a child has picked one.
function showProfileForm(profileId = null) {
  const profile = state.profiles.profiles.find(item => item.id === profileId) || null;
  const usedAvatars = new Set(state.profiles.profiles.map(item => item.avatar));
  profileSheet.editingId = profile ? profile.id : null;
  profileSheet.confirmingDelete = false;
  showProfileView('form', profile ? 'Upraviť profil' : 'Vyber si zvieratko');
  elements.profileName.value = profile ? profile.name : '';
  elements.profileDelete.hidden = !profile;
  elements.profileDelete.textContent = 'Zmazať';
  setFormAvatar(profile ? profile.avatar : (Avatars.AVATAR_KEYS.find(key => !usedAvatars.has(key)) || Avatars.AVATAR_KEYS[0]));
  elements.avatarPicker.querySelector('[aria-checked="true"]').focus();
}

function onAvatarPickerKeyDown(event) {
  const steps = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 };
  if (!(event.key in steps)) return;
  event.preventDefault();
  const keys = Avatars.AVATAR_KEYS;
  const next = keys[(keys.indexOf(profileSheet.avatar) + steps[event.key] + keys.length) % keys.length];
  setFormAvatar(next);
  elements.avatarPicker.querySelector(`[data-avatar="${next}"]`).focus();
}

function populateAvatarPicker() {
  for (const avatar of Avatars.AVATARS) {
    const button = avatarBadge(avatar, 'button');
    button.type = 'button';
    button.classList.add('avatar-option');
    button.dataset.avatar = avatar.key;
    button.setAttribute('role', 'radio');
    button.setAttribute('aria-label', avatar.label);
    elements.avatarPicker.append(button);
  }
}

function submitProfileForm(event) {
  event.preventDefault();
  const values = { name: elements.profileName.value, avatar: profileSheet.avatar };
  elements.profileName.blur();
  if (profileSheet.editingId) {
    state.profiles = Engine.updateProfile(state.profiles, profileSheet.editingId, values);
    Engine.saveProfiles(state.profiles, appStorage);
    renderProfileButton();
    showProfilePicker();
    return;
  }

  const isFirstProfile = state.profiles.profiles.length === 0;
  state.profiles = Engine.addProfile(state.profiles, values);
  if (isFirstProfile) Engine.adoptGuestData(appStorage, state.profiles.activeId);
  closeProfiles();
  saveProfilesAndApply();
}

// Removing a profile also removes that child's practice, so it takes a
// second, explicit tap.
function deleteEditedProfile() {
  if (!profileSheet.confirmingDelete) {
    profileSheet.confirmingDelete = true;
    elements.profileDelete.textContent = 'Naozaj zmazať?';
    return;
  }
  const removedId = profileSheet.editingId;
  const wasActive = removedId === state.profiles.activeId;
  state.profiles = Engine.removeProfile(state.profiles, removedId);
  Engine.removeProfileData(appStorage, removedId);
  if (wasActive) {
    saveProfilesAndApply();
  } else {
    Engine.saveProfiles(state.profiles, appStorage);
  }
  showProfilePicker();
}

function chooseProfile(profileId) {
  closeProfiles();
  if (profileId === state.profiles.activeId) return;
  state.profiles = Engine.selectProfile(state.profiles, profileId);
  saveProfilesAndApply();
}

function statsLetters() {
  const available = new Set(state.cards.map(card => card.selected_letter));
  return LETTER_ORDER.filter(letter => available.has(letter));
}

function showWordStats() {
  const profile = Engine.activeProfile(state.profiles);
  showProfileView('stats', profile ? `Slová: ${profileDisplayName(profile)}` : 'Moje slová');
  const letters = statsLetters();
  if (!letters.includes(profileSheet.statsLetter)) profileSheet.statsLetter = letters[0] || null;
  elements.statsLetters.textContent = '';
  for (const letter of letters) {
    const button = document.createElement('button');
    button.className = 'letter-filter-button';
    button.type = 'button';
    button.dataset.letter = letter;
    button.textContent = letter;
    elements.statsLetters.append(button);
  }
  renderMasteryGrid();
  (elements.statsLetters.querySelector('[aria-pressed="true"]') || elements.statsBack).focus();
}

function renderMasteryGrid() {
  const letter = profileSheet.statsLetter;
  elements.statsLetters.querySelectorAll('.letter-filter-button').forEach(button => {
    button.setAttribute('aria-pressed', String(button.dataset.letter === letter));
  });
  elements.statsWord.textContent = letter ? 'Ťukni na štvorček.' : 'Slová sa ešte načítavajú.';
  elements.masteryGrid.textContent = '';
  const cards = Engine.filterCardsByLetters(state.cards, [letter])
    .slice()
    .sort((left, right) => left.surface.localeCompare(right.surface, 'sk'));
  for (const card of cards) {
    const tile = document.createElement('button');
    tile.type = 'button';
    tile.className = `mastery-tile mastery-${Engine.masteryLevel(state.progress.cards[card.id])}`;
    tile.dataset.cardId = card.id;
    tile.setAttribute('aria-pressed', 'false');
    tile.setAttribute('aria-label', card.surface);
    elements.masteryGrid.append(tile);
  }
}

function showStatsWord(cardId) {
  const card = state.cards.find(item => item.id === cardId);
  if (!card) return;
  elements.masteryGrid.querySelectorAll('.mastery-tile').forEach(tile => {
    tile.setAttribute('aria-pressed', String(tile.dataset.cardId === cardId));
  });

  const record = state.progress.cards[card.id];
  const word = document.createElement('strong');
  const maskIndex = card.masked_surface.indexOf('_');
  const letter = document.createElement('span');
  letter.className = `answer-${card.answer_group}`;
  letter.textContent = card.surface[maskIndex] || '';
  word.append(card.surface.slice(0, maskIndex), letter, card.surface.slice(maskIndex + 1));
  const detail = record ? `správne ${record.correct} z ${record.seen}` : 'ešte neprišlo';
  elements.statsWord.textContent = '';
  // Contrast words such as výr / vír need their sentence to make sense.
  elements.statsWord.append(word, card.full_sentence !== card.surface ? `${card.full_sentence} · ${detail}` : detail);
}

function openProfiles() {
  elements.profileOverlay.hidden = false;
  if (state.profiles.profiles.length) {
    showProfilePicker();
  } else {
    showProfileForm();
  }
}

function closeProfiles() {
  elements.profileOverlay.hidden = true;
  elements.profileOpen.focus();
}

function onProfileListClick(event) {
  const edit = event.target.closest('[data-edit-id]');
  if (edit) {
    showProfileForm(edit.dataset.editId);
    return;
  }
  const choice = event.target.closest('.profile-choice');
  if (!choice) return;
  if (choice.dataset.add) {
    showProfileForm();
  } else {
    chooseProfile(choice.dataset.profileId);
  }
}

function openAbout() {
  elements.aboutOverlay.hidden = false;
  elements.aboutClose.focus();
}

function closeAbout() {
  elements.aboutOverlay.hidden = true;
  elements.aboutOpen.focus();
}

function onSheetKeyDown(event) {
  if (event.key !== 'Escape') return;
  if (!elements.aboutOverlay.hidden) closeAbout();
  if (!elements.profileOverlay.hidden) closeProfiles();
}

function resetRound() {
  cancelIntro();
  clearConfetti();
  elements.outgoingLayer.textContent = '';
  state.index = 0;
  state.locked = false;
  state.round = createCurrentRound();
  render();
  setFeedback('', 'quiet');
}

async function start() {
  try {
    const fetchText = path => fetch(path).then(response => {
      if (!response.ok) throw new Error(`HTTP ${response.status} for ${path}`);
      return response.text();
    });
    const [tsv, ...simpleLists] = await Promise.all([
      fetchText('./data/disambiguation.tsv'),
      ...LETTER_ORDER.map(letter => fetchText(`./data/simple/${letter}.txt`)),
    ]);
    const ambiguousCards = Engine.loadDisambiguationCards(tsv);
    const simpleCards = Engine.loadSimpleCards(Object.fromEntries(
      LETTER_ORDER.map((letter, index) => [letter, simpleLists[index]]),
    ));
    state.cards = HIDDEN_AMBIGUOUS_ONLY ? ambiguousCards : [...ambiguousCards, ...simpleCards];
    populateLetterFilter();
    state.round = createCurrentRound();
    render();
    setFeedback('', 'quiet');
    runIntro();
  } catch (error) {
    elements.maskedWord.textContent = 'chyba';
    elements.sentence.textContent = 'Kartičky sa nenačítali.';
    setFeedback(error.message, 'needs-work');
  }
}

elements.letterFilter.addEventListener('click', event => {
  const button = event.target.closest('.letter-filter-button');
  if (!button) return;
  const letter = button.dataset.letter;
  if (!letter) return;

  state.selectedLetters = state.selectedLetters.includes(letter)
    ? state.selectedLetters.filter(selected => selected !== letter)
    : [...state.selectedLetters, letter].sort((left, right) => LETTER_ORDER.indexOf(left) - LETTER_ORDER.indexOf(right));
  updateLetterFilter();
  saveSettings();
  resetRound();
});
elements.aboutOpen.addEventListener('click', openAbout);
elements.aboutClose.addEventListener('click', closeAbout);
elements.aboutOverlay.addEventListener('click', closeAbout);
elements.aboutSheet.addEventListener('click', event => event.stopPropagation());
window.addEventListener('keydown', onSheetKeyDown);
elements.profileOpen.addEventListener('click', openProfiles);
elements.profileClose.addEventListener('click', closeProfiles);
elements.profileOverlay.addEventListener('click', closeProfiles);
elements.profileSheet.addEventListener('click', event => event.stopPropagation());
elements.profileList.addEventListener('click', onProfileListClick);
elements.avatarPicker.addEventListener('keydown', onAvatarPickerKeyDown);
elements.avatarPicker.addEventListener('click', event => {
  const option = event.target.closest('.avatar-option');
  if (option) setFormAvatar(option.dataset.avatar);
});
elements.profileForm.addEventListener('submit', submitProfileForm);
elements.profileBack.addEventListener('click', showProfilePicker);
elements.profileDelete.addEventListener('click', deleteEditedProfile);
elements.statsOpen.addEventListener('click', showWordStats);
elements.statsBack.addEventListener('click', showProfilePicker);
elements.statsLetters.addEventListener('click', event => {
  const button = event.target.closest('.letter-filter-button');
  if (!button) return;
  profileSheet.statsLetter = button.dataset.letter;
  renderMasteryGrid();
});
elements.masteryGrid.addEventListener('click', event => {
  const tile = event.target.closest('.mastery-tile');
  if (tile) showStatsWord(tile.dataset.cardId);
});
elements.card.addEventListener('pointerdown', onPointerDown);
window.addEventListener('pointermove', onPointerMove);
window.addEventListener('pointerup', onPointerUp);
window.addEventListener('pointercancel', onPointerCancel);
elements.card.addEventListener('mousedown', onMouseDown);
window.addEventListener('mousemove', onMouseMove);
window.addEventListener('mouseup', onMouseUp);
elements.card.addEventListener('touchstart', onTouchStart, { passive: false });
window.addEventListener('touchmove', onTouchMove, { passive: false });
window.addEventListener('touchend', onTouchEnd, { passive: false });
window.addEventListener('touchcancel', onTouchCancel, { passive: false });

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(registration => registration.update());
  });
}

populateAvatarPicker();
renderProfileButton();
start();
</script>
</body>
</html>
