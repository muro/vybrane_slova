<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3ebdd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vybrané slová">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Vybrané slová</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="preload" href="./fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Nunito variable, subset per Google Fonts unicode-range so Slovak diacritics
     load from latin-ext without pulling Cyrillic or Vietnamese. */
  @font-face {
    font-family: 'Nunito';
    font-style: normal;
    font-weight: 400 900;
    font-display: swap;
    src: url('./fonts/nunito-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  @font-face {
    font-family: 'Nunito';
    font-style: normal;
    font-weight: 400 900;
    font-display: swap;
    src: url('./fonts/nunito-latin-ext.woff2') format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }

  :root {
    color-scheme: light;
    --paper: #f3ebdd;
    --paper-top: #fcf7ee;
    --card: #fffcf5;
    --ink: #2a251d;
    --muted: #7b7060;
    --hairline: rgba(42, 37, 29, 0.1);
    --blue-strong: #2563b8;
    --gold-strong: #a8550c;
    --green-strong: #177245;
    --rose-strong: #a82f35;
    --card-w: min(344px, calc(100vw - 64px));
    --card-h: clamp(242px, 38dvh, 302px);
    --card-radius: 26px;
  }

  * { box-sizing: border-box; }

  html,
  body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Nunito', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow-x: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    min-height: 100dvh;
    background: radial-gradient(120% 74% at 50% 0%, var(--paper-top) 0%, var(--paper) 76%) fixed;
  }

  button {
    font: inherit;
  }

  .app {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 100vw;
    min-height: 100dvh;
    overflow: hidden;
    padding: calc(18px + env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    display: grid;
    grid-template-rows: auto 1fr;
    gap: 16px;
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    min-height: 40px;
  }

  .chrome-button,
  .letter-filter-button {
    min-height: 40px;
    border: 1px solid var(--hairline);
    background: rgba(255, 253, 246, 0.6);
    color: var(--muted);
    font-weight: 700;
  }

  .letter-filter {
    display: flex;
    flex: 1;
    gap: 4px;
    align-items: center;
    min-width: 0;
  }

  .letter-filter-button {
    width: clamp(30px, 9vw, 40px);
    min-width: 30px;
    height: clamp(30px, 9vw, 40px);
    min-height: 30px;
    padding: 0;
    border-radius: 50%;
    font: inherit;
    font-weight: 900;
    line-height: 1;
    cursor: pointer;
  }

  .letter-filter-button[aria-pressed="true"] {
    border-color: var(--blue-strong);
    background: var(--blue-strong);
    color: #fff;
    box-shadow: 0 4px 10px rgba(37, 99, 184, 0.25);
  }

  .chrome-button {
    min-width: 40px;
    padding: 8px 11px;
    border-radius: 999px;
    display: inline-grid;
    place-items: center;
    font-size: 18px;
    text-align: center;
    cursor: pointer;
  }

  .chrome-button:focus-visible,
  .letter-filter-button:focus-visible {
    outline: 3px solid rgba(37, 99, 184, 0.28);
    outline-offset: 2px;
  }

  .board {
    position: relative;
    width: min(620px, 100%);
    margin: 0 auto;
    display: grid;
    justify-items: center;
    align-content: center;
    gap: 20px;
  }

  .card-stage {
    position: relative;
    width: var(--card-w);
    height: var(--card-h);
    isolation: isolate;
  }

  /* The stack is material, not a queue: blank sheets give the active card a
     physical home without previewing another word or becoming a destination. */
  .card-stage::before,
  .card-stage::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    border: 1px solid rgba(112, 89, 55, 0.1);
    border-radius: var(--card-radius);
    background: linear-gradient(145deg, #fffef9, #f7efe3);
    box-shadow: 0 3px 0 #e8ddcd, 0 11px 22px -20px rgba(62, 46, 24, 0.75);
    pointer-events: none;
  }

  .card-stage::before {
    transform: translate(5px, 9px) rotate(0.45deg);
  }

  .card-stage::after {
    transform: translate(-3px, 4px) rotate(-0.3deg);
  }

  .word-card {
    position: absolute;
    inset: 0;
    z-index: 2;
    padding: 26px 22px;
    border-radius: var(--card-radius);
    border: 1px solid rgba(112, 89, 55, 0.12);
    background: linear-gradient(145deg, #fffef9 0%, var(--card) 58%, #f7efe3 100%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.96),
      inset 0 -3px 0 rgba(141, 112, 72, 0.07),
      0 3px 0 #ebe0d0,
      0 6px 0 #dacbb8,
      var(--shadow-x, 0px) calc(19px + var(--drag-lift, 0px)) calc(36px + var(--drag-lift, 0px)) -24px rgba(62, 46, 24, 0.48),
      var(--shadow-x, 0px) calc(38px + var(--drag-lift, 0px)) calc(64px + var(--drag-lift, 0px)) -36px rgba(62, 46, 24, 0.32);
    display: grid;
    align-content: center;
    gap: 16px;
    text-align: center;
    cursor: grab;
    touch-action: none;
    user-select: none;
    transform: translate(var(--drag-x, 0), var(--drag-y, 0)) rotate(var(--drag-rotate, 0deg)) scale(var(--drag-scale, 1));
    transition: transform 300ms cubic-bezier(0.2, 0.9, 0.25, 1.22), opacity 260ms ease;
    overflow: hidden;
  }

  /* A restrained sheen and visible paper edge make the card feel substantial,
     while still leaving the word as the only focus. */
  .word-card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background:
      linear-gradient(118deg, rgba(255, 255, 255, 0.7) 0%, rgba(255, 255, 255, 0.17) 27%, transparent 47%),
      linear-gradient(180deg, rgba(255, 255, 255, 0.22), transparent 34%);
    pointer-events: none;
  }

  .word-card.upcoming-card {
    z-index: 1;
    pointer-events: none;
    transform: translate(-3px, 4px) rotate(-0.3deg);
  }

  .outgoing-layer {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
  }

  .word-card.dragging {
    cursor: grabbing;
    transition: none;
  }

  .word-card.exit-correct {
    transform-origin: center;
    animation: correct-card-tear 340ms ease-out forwards;
  }

  .word-card.exit-wrong {
    animation: wrong-card-fade 2000ms ease forwards;
  }

  /* A wrong answer has one clear home for its correction: the departing card.
     Keep it large and steady long enough to read before the card breaks apart. */
  .word-card.outgoing-card.exit-wrong .full-word {
    padding: 6px 10px;
    border-radius: 999px;
    background: rgba(168, 47, 53, 0.1);
    color: var(--rose-strong);
    font-size: 20px;
    font-weight: 900;
  }

  @keyframes wrong-card-fade {
    0%, 62% {
      opacity: 1;
    }

    80%, 100% {
      opacity: 0;
      transform: translate(var(--drag-x, 0), var(--drag-y, 0)) scale(0.98);
    }
  }

  @keyframes correct-card-tear {
    0%, 20% {
      opacity: 1;
      filter: brightness(1);
      clip-path: inset(0 round var(--card-radius));
      transform: translate(var(--drag-x, 0), var(--drag-y, 0)) rotate(var(--drag-rotate, 0deg)) scale(var(--drag-scale, 1));
    }

    55% {
      opacity: 0.38;
      filter: brightness(1.13) saturate(1.12);
      clip-path: inset(0 round var(--card-radius));
      transform: translate(var(--drag-x, 0), var(--drag-y, 0)) rotate(var(--drag-rotate, 0deg)) scale(1.01);
    }

    100% {
      opacity: 0;
      filter: brightness(1.26) saturate(1.25);
      clip-path: inset(0 round var(--card-radius));
      transform: translate(var(--drag-x, 0), var(--drag-y, 0)) rotate(var(--drag-rotate, 0deg)) scale(1.02);
    }
  }

  .masked-word {
    font-size: clamp(46px, 12vw, 74px);
    line-height: 1.05;
    font-weight: 800;
    letter-spacing: -0.015em;
  }

  /* At rest the gap is a soft tinted well rather than an underscore, so the card
     reads as a word waiting for a letter instead of broken text. */
  .letter-slot {
    display: inline-grid;
    min-width: 0.58em;
    min-height: 0.86em;
    margin: 0 0.04em;
    border-radius: 0.16em;
    background: rgba(42, 37, 29, 0.055);
    place-items: center;
    transition: background-color 140ms ease, color 140ms ease, box-shadow 140ms ease;
  }

  /* Two stages, both inside the word: a tinted preview while the card is still
     short of the submit distance, then solid colour once letting go will
     answer. That commit moment is the only cue, so it has to be unmissable. */
  .letter-slot.fill-i {
    background: rgba(37, 99, 184, 0.16);
    color: var(--blue-strong);
  }

  .letter-slot.fill-y {
    background: rgba(168, 85, 12, 0.16);
    color: var(--gold-strong);
  }

  .letter-slot.fill-i.ready {
    background: var(--blue-strong);
    color: #fff;
    box-shadow: 0 10px 22px -8px rgba(37, 99, 184, 0.55);
  }

  .letter-slot.fill-y.ready {
    background: var(--gold-strong);
    color: #fff;
    box-shadow: 0 10px 22px -8px rgba(168, 85, 12, 0.55);
  }

  .sentence {
    margin: 0;
    color: var(--muted);
    font-size: 19px;
    font-weight: 600;
    line-height: 1.4;
  }

  .full-word {
    min-height: 1.5em;
    font-size: 17px;
    font-weight: 700;
    color: var(--muted);
  }

  .full-word.answer-i { color: var(--blue-strong); }

  .full-word.answer-y { color: var(--gold-strong); }

  .confetti-layer {
    position: absolute;
    inset: 0;
    overflow: visible;
    pointer-events: none;
    z-index: 4;
  }

  .confetti-piece {
    position: absolute;
    left: 50%;
    top: 48%;
    width: var(--confetti-width, 7px);
    height: var(--confetti-height, 11px);
    border-radius: 2px;
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.7) rotate(0deg);
    animation: confetti-pop 760ms cubic-bezier(0.16, 0.92, 0.32, 1) forwards;
    animation-delay: var(--confetti-delay, 0ms);
  }

  .card-effect-piece {
    position: absolute;
    left: var(--piece-left);
    top: var(--piece-top);
    pointer-events: none;
    will-change: transform, opacity;
  }

  .card-confetti-piece {
    width: var(--piece-width, 18px);
    height: var(--piece-height, 24px);
    opacity: 0;
    perspective: 600px;
    transform: translate(-50%, -50%) scale(1) rotate(0deg);
    transform-style: preserve-3d;
    animation: card-tear-pop 940ms cubic-bezier(0.14, 0.84, 0.28, 1) forwards;
    animation-delay: var(--piece-delay, 0ms);
  }

  .card-confetti-face {
    position: absolute;
    inset: 0;
    border-radius: 3px;
    overflow: hidden;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }

  .card-confetti-front {
    background: var(--card);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
    animation: tear-front-face 940ms linear forwards;
    animation-delay: var(--piece-delay, 0ms);
  }

  .card-confetti-rear {
    background-color: var(--piece-color);
    background-image: linear-gradient(120deg, rgba(255, 255, 255, 0.78) 0%, rgba(255, 255, 255, 0.14) 28%, transparent 49%);
    border: 1px solid rgba(255, 255, 255, 0.48);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.64), 0 3px 7px rgba(62, 46, 24, 0.16);
    opacity: 0;
    backface-visibility: visible;
    -webkit-backface-visibility: visible;
    animation: tear-rear-face 940ms linear forwards;
    animation-delay: var(--piece-delay, 0ms);
  }

  .tear-front-card {
    position: absolute;
    right: auto;
    bottom: auto;
    min-height: 0;
    box-shadow: none;
    transform: none !important;
    transition: none !important;
    pointer-events: none;
  }

  .paper-strip {
    width: var(--piece-width);
    height: var(--piece-height);
    overflow: hidden;
    border: 1px solid rgba(168, 47, 53, 0.18);
    border-radius: 10px;
    background: var(--card);
    box-shadow: 0 12px 24px rgba(58, 43, 22, 0.12);
    opacity: 0;
    transform: translate(-50%, -50%) rotate(var(--piece-start-rotate, 0deg));
    animation: paper-strip-fall 880ms cubic-bezier(0.22, 0.62, 0.36, 1) forwards;
    animation-delay: var(--piece-delay, 0ms);
  }

  .paper-strip::before,
  .paper-strip::after {
    content: "";
    position: absolute;
    left: 8px;
    right: 8px;
    z-index: 2;
    border-top: 1px dashed rgba(168, 47, 53, 0.18);
    pointer-events: none;
  }

  .paper-strip::before {
    top: 0;
  }

  .paper-strip::after {
    bottom: 0;
  }

  .paper-strip-card {
    position: absolute;
    left: 0;
    top: calc(-1 * var(--strip-offset));
    right: auto;
    bottom: auto;
    width: var(--card-width);
    min-height: var(--card-height);
    height: var(--card-height);
    box-shadow: none;
    transform: none !important;
    transition: none !important;
    pointer-events: none;
  }

  @keyframes confetti-pop {
    12% {
      opacity: 1;
    }

    100% {
      opacity: 0;
      transform: translate(calc(-50% + var(--confetti-x)), calc(-50% + var(--confetti-y))) scale(1) rotate(var(--confetti-rotate));
    }
  }

  @keyframes card-tear-pop {
    8% {
      opacity: 1;
    }

    38% {
      opacity: 1;
      transform: translate(calc(-50% + var(--piece-mid-x)), calc(-50% + var(--piece-mid-y))) scale(1.02) rotate(var(--piece-mid-rotate)) rotateY(var(--piece-mid-flip));
    }

    100% {
      opacity: 0;
      transform: translate(calc(-50% + var(--piece-x)), calc(-50% + var(--piece-y))) scale(0.7) rotate(var(--piece-rotate)) rotateY(var(--piece-flip));
    }
  }

  @keyframes tear-front-face {
    0%, 31% { opacity: 1; }
    44%, 100% { opacity: 0; }
  }

  @keyframes tear-rear-face {
    0%, 31% { opacity: 0; }
    44%, 100% { opacity: 1; }
  }

  @keyframes paper-strip-fall {
    0% {
      opacity: 0;
      transform: translate(-50%, -52%) rotate(var(--piece-start-rotate, 0deg));
    }

    12% {
      opacity: 1;
    }

    100% {
      opacity: 0;
      transform: translate(calc(-50% + var(--piece-x)), calc(-50% + var(--piece-y))) rotate(var(--piece-rotate));
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .card-confetti-piece,
    .paper-strip,
    .confetti-piece {
      animation-duration: 240ms;
    }

    .word-card.exit-wrong {
      animation-duration: 240ms;
    }

    .word-card.exit-correct {
      animation-duration: 240ms;
    }
  }

  .feedback {
    min-height: 1.5em;
    max-width: min(420px, 100%);
    margin: 0;
    padding: 0 10px;
    text-align: center;
    font-size: 17px;
    font-weight: 700;
    color: var(--muted);
    transition: opacity 200ms ease;
  }

  .feedback.good { color: var(--green-strong); }

  .feedback.needs-work { color: var(--rose-strong); }

  .feedback.done { color: var(--blue-strong); }

  .feedback.quiet {
    opacity: 0;
  }

  .about-overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    padding: 24px;
    display: grid;
    place-items: center;
    background: rgba(58, 43, 22, 0.3);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
  }

  .about-overlay[hidden] {
    display: none;
  }

  .about-sheet {
    position: relative;
    width: min(340px, 100%);
    padding: 30px 24px 24px;
    border-radius: var(--card-radius);
    background: var(--card);
    box-shadow: 0 26px 60px -20px rgba(37, 34, 29, 0.38);
    text-align: center;
  }

  .about-sheet h2 {
    margin: 0;
    padding: 0 24px;
    font-size: 22px;
    line-height: 1.1;
    letter-spacing: 0;
  }

  .about-sheet p {
    margin: 14px 0 0;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.4;
  }

  .about-sheet a {
    color: var(--blue-strong);
    font-weight: 800;
    text-decoration: none;
  }

  .support-link {
    display: inline-block;
    margin-top: 22px;
    padding: 11px 20px;
    border-radius: 999px;
    background: var(--blue-strong);
    color: #fff !important;
    box-shadow: 0 8px 18px rgba(37, 99, 184, 0.18);
  }

  .privacy-note {
    font-size: 12px !important;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .sheet-close {
    position: absolute;
    top: 10px;
    right: 12px;
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 24px;
    line-height: 1;
    padding: 6px 9px;
    cursor: pointer;
  }

  .sheet-close:focus-visible {
    outline: 3px solid rgba(37, 99, 184, 0.28);
    outline-offset: 2px;
    border-radius: 8px;
  }

  @media (max-width: 760px) {
    .app {
      padding-left: 10px;
      padding-right: 10px;
      gap: 12px;
    }

    .topbar {
      min-height: 38px;
    }

    .word-card {
      padding: 22px 16px;
      gap: 14px;
    }

    .sentence {
      font-size: 17px;
    }

    .full-word,
    .feedback {
      font-size: 16px;
    }
  }
</style>
</head>
<body>
<main class="app">
  <header class="topbar" aria-label="Nastavenia">
    <div class="letter-filter" id="letter-filter" role="group" aria-label="Vybrať písmená"></div>
    <button class="chrome-button" type="button" id="about-open" aria-label="O aplikácii">?</button>
  </header>

  <section class="board" aria-label="Triedenie kartičiek">
    <div class="card-stage" aria-live="polite">
      <article class="word-card upcoming-card" id="upcoming-card" aria-hidden="true" hidden>
        <div class="masked-word" id="upcoming-masked-word"></div>
        <p class="sentence" id="upcoming-sentence"></p>
        <div class="full-word" id="upcoming-full-word"></div>
      </article>
      <article class="word-card" id="word-card">
        <div class="masked-word" id="masked-word"></div>
        <p class="sentence" id="sentence">Načítavam kartičky.</p>
        <div class="full-word" id="full-word"></div>
      </article>
      <div class="outgoing-layer" id="outgoing-layer" aria-hidden="true"></div>
    </div>
    <p class="feedback quiet" id="feedback" aria-live="polite"></p>
    <div class="confetti-layer" id="confetti-layer" aria-hidden="true"></div>
  </section>
</main>
<div class="about-overlay" id="about-overlay" hidden>
  <section class="about-sheet" role="dialog" aria-modal="true" aria-labelledby="about-title">
    <button class="sheet-close" type="button" id="about-close" aria-label="Zavrieť">×</button>
    <h2 id="about-title">Vybrané slová</h2>
    <p>Krátke precvičovanie slov, kde si dieťa vyberá medzi i/í a y/ý potiahnutím kartičky.</p>
    <a class="support-link" href="mailto:vybrane-slova@aidistillery.dev?subject=Vybrane%20slova%20feedback">Napísať spätnú väzbu</a>
    <p>Vytvorené na <a href="https://aidistillery.dev" target="_blank" rel="noopener noreferrer">aidistillery.dev</a></p>
    <p class="privacy-note">Bez zbierania dát</p>
  </section>
</div>

<script src="./engine.js?v=4"></script>
<script>
const Engine = window.VybraneSlovaEngine;
const WRONG_STRIP_DELAY_MS = 1280;
const WRONG_OUTGOING_LIFETIME_MS = 2400;

const elements = {
  card: document.querySelector('#word-card'),
  upcomingCard: document.querySelector('#upcoming-card'),
  outgoingLayer: document.querySelector('#outgoing-layer'),
  confettiLayer: document.querySelector('#confetti-layer'),
  maskedWord: document.querySelector('#masked-word'),
  upcomingMaskedWord: document.querySelector('#upcoming-masked-word'),
  sentence: document.querySelector('#sentence'),
  upcomingSentence: document.querySelector('#upcoming-sentence'),
  fullWord: document.querySelector('#full-word'),
  upcomingFullWord: document.querySelector('#upcoming-full-word'),
  feedback: document.querySelector('#feedback'),
  letterFilter: document.querySelector('#letter-filter'),
  aboutOpen: document.querySelector('#about-open'),
  aboutClose: document.querySelector('#about-close'),
  aboutOverlay: document.querySelector('#about-overlay'),
  aboutSheet: document.querySelector('.about-sheet'),
};

let confettiTimer = null;

function getStorage() {
  try {
    return window.localStorage;
  } catch (_error) {
    return null;
  }
}

const appStorage = getStorage();
const LETTER_ORDER = ['b', 'm', 'p', 'r', 's', 'v', 'z'];

function loadSettings(storage) {
  if (!storage) return { selectedLetters: null };
  try {
    const raw = storage.getItem(Engine.STORAGE_KEYS.settings);
    const saved = raw ? JSON.parse(raw) : {};
    const selectedLetters = Array.isArray(saved.selectedLetters)
      ? saved.selectedLetters.filter(letter => typeof letter === 'string')
      : null;
    return {
      selectedLetters,
    };
  } catch (_error) {
    return { selectedLetters: null };
  }
}

function saveSettings() {
  if (!appStorage) return;
  try {
    appStorage.setItem(Engine.STORAGE_KEYS.settings, JSON.stringify({
      selectedLetters: state.selectedLetters,
    }));
  } catch (_error) {
    // Practice should continue even if storage is unavailable.
  }
}

const settings = loadSettings(appStorage);

const state = {
  cards: [],
  round: [],
  index: 0,
  correct: 0,
  locked: false,
  selectedLetters: settings.selectedLetters,
  progress: Engine.loadProgress(appStorage),
};

const drag = {
  active: false,
  pointerId: null,
  source: null,
  startX: 0,
  startY: 0,
  lastX: 0,
  lastY: 0,
  startTime: 0,
  moved: false,
  hintAnswer: null,
  hintReady: false,
  lastPointerAt: 0,
};

function currentCard() {
  return state.round[state.index] || null;
}

function nextCardInRound() {
  return state.round[state.index + 1] || null;
}

function renderStats() {
  document.title = state.round.length
    ? `Vybrané slová ${Math.min(state.index + 1, state.round.length)}/${state.round.length}`
    : 'Vybrané slová';
}

function cardsForSelectedLetters() {
  return Engine.filterCardsByLetters(state.cards, state.selectedLetters);
}

function createCurrentRound() {
  return Engine.createRound(cardsForSelectedLetters(), { seed: Date.now() });
}

function populateLetterFilter() {
  const available = new Set(state.cards.map(card => card.selected_letter).filter(Boolean));
  const letters = LETTER_ORDER.filter(letter => available.has(letter));
  state.selectedLetters = Array.isArray(state.selectedLetters)
    ? state.selectedLetters.filter(letter => available.has(letter))
    : letters.slice();

  elements.letterFilter.textContent = '';
  for (const letter of letters) {
    const button = document.createElement('button');
    button.className = 'letter-filter-button';
    button.type = 'button';
    button.dataset.letter = letter;
    button.textContent = letter;
    button.setAttribute('aria-pressed', String(state.selectedLetters.includes(letter)));
    elements.letterFilter.append(button);
  }
}

function updateLetterFilter() {
  elements.letterFilter.querySelectorAll('.letter-filter-button').forEach(button => {
    button.setAttribute('aria-pressed', String(state.selectedLetters.includes(button.dataset.letter)));
  });
}

function setFeedback(text, className = '') {
  elements.feedback.className = `feedback ${className}`.trim();
  elements.feedback.textContent = text;
}

function clearConfetti() {
  if (confettiTimer) {
    window.clearTimeout(confettiTimer);
    confettiTimer = null;
  }
  elements.confettiLayer.textContent = '';
}

function cardBoxInEffectLayer(card) {
  const cardRect = card.getBoundingClientRect();
  const layerRect = elements.confettiLayer.getBoundingClientRect();
  return {
    left: cardRect.left - layerRect.left,
    top: cardRect.top - layerRect.top,
    width: cardRect.width,
    height: cardRect.height,
  };
}

function addEffectPiece(className, left, top, customProperties = {}) {
  const piece = document.createElement('div');
  piece.className = `card-effect-piece ${className}`;
  piece.style.setProperty('--piece-left', `${left}px`);
  piece.style.setProperty('--piece-top', `${top}px`);
  for (const [name, value] of Object.entries(customProperties)) {
    piece.style.setProperty(name, value);
  }
  elements.confettiLayer.append(piece);
  return piece;
}

function showCardTear(answerGroup, card) {
  const answerColors = answerGroup === 'i'
    ? ['#2563b8', '#4e9ce5', '#7c5ce7']
    : ['#e59524', '#f6bd45', '#ef6a56'];
  const colors = [...answerColors, '#20a565', '#e3477a', '#25abc6', '#9b61db'];
  const box = cardBoxInEffectLayer(card);
  const centerX = box.left + box.width / 2;
  const centerY = box.top + box.height / 2;
  clearConfetti();

  for (let index = 0; index < 46; index++) {
    const width = 11 + Math.random() * 18;
    const height = 14 + Math.random() * 22;
    const sourceLeft = Math.random() * Math.max(1, box.width - width);
    const sourceTop = Math.random() * Math.max(1, box.height - height);
    const left = box.left + sourceLeft + width / 2;
    const top = box.top + sourceTop + height / 2;
    const fromCenterX = left - centerX;
    const fromCenterY = top - centerY;
    const angle = Math.atan2(fromCenterY, fromCenterX) + (-0.8 + Math.random() * 1.6);
    const distance = 86 + Math.random() * 148;
    const rotation = -320 + Math.random() * 640;
    const flip = 180 + Math.random() * 120;
    const piece = addEffectPiece('card-confetti-piece', left, top, {
      '--piece-x': `${Math.cos(angle) * distance}px`,
      '--piece-y': `${Math.sin(angle) * distance - 34 - Math.random() * 42}px`,
      '--piece-mid-x': `${Math.cos(angle) * distance * 0.22}px`,
      '--piece-mid-y': `${Math.sin(angle) * distance * 0.22 - 8}px`,
      '--piece-rotate': `${rotation}deg`,
      '--piece-mid-rotate': `${rotation * 0.24}deg`,
      '--piece-flip': `${flip}deg`,
      '--piece-mid-flip': `${flip * 0.6}deg`,
      '--piece-delay': `${index * 5}ms`,
      '--piece-width': `${width}px`,
      '--piece-height': `${height}px`,
      '--piece-color': colors[index % colors.length],
    });
    const front = document.createElement('div');
    front.className = 'card-confetti-face card-confetti-front';
    const cardSlice = card.cloneNode(true);
    cardSlice.removeAttribute('id');
    cardSlice.classList.remove('dragging', 'exit-correct', 'exit-wrong');
    cardSlice.classList.add('tear-front-card');
    cardSlice.querySelectorAll('[id]').forEach(node => node.removeAttribute('id'));
    cardSlice.style.left = `${-sourceLeft}px`;
    cardSlice.style.top = `${-sourceTop}px`;
    cardSlice.style.width = `${box.width}px`;
    cardSlice.style.height = `${box.height}px`;
    front.append(cardSlice);
    const rear = document.createElement('div');
    rear.className = 'card-confetti-face card-confetti-rear';
    piece.append(front, rear);
  }

  confettiTimer = window.setTimeout(clearConfetti, 1280);
}

function showWrongFallApart(card) {
  const box = cardBoxInEffectLayer(card);
  const strips = 5;
  clearConfetti();

  for (let index = 0; index < strips; index++) {
    const stripHeight = box.height / strips;
    const left = box.left + box.width / 2 + (-5 + Math.random() * 10);
    const top = box.top + stripHeight * (index + 0.5);
    const piece = addEffectPiece('paper-strip', left, top, {
      '--piece-width': `${box.width}px`,
      '--piece-height': `${Math.max(28, stripHeight + 4)}px`,
      '--card-width': `${box.width}px`,
      '--card-height': `${box.height}px`,
      '--strip-offset': `${stripHeight * index}px`,
      '--piece-x': `${-48 + Math.random() * 96}px`,
      '--piece-y': `${230 + index * 24 + Math.random() * 42}px`,
      '--piece-rotate': `${-28 + Math.random() * 56}deg`,
      '--piece-start-rotate': `${-3 + Math.random() * 6}deg`,
      '--piece-delay': `${WRONG_STRIP_DELAY_MS + index * 36}ms`,
    });
    const cardSlice = card.cloneNode(true);
    cardSlice.removeAttribute('id');
    cardSlice.classList.remove('dragging', 'exit-correct', 'exit-wrong');
    cardSlice.classList.add('paper-strip-card');
    cardSlice.querySelectorAll('[id]').forEach(node => node.removeAttribute('id'));
    piece.append(cardSlice);
  }

  confettiTimer = window.setTimeout(clearConfetti, WRONG_OUTGOING_LIFETIME_MS);
}

function letterForAnswer(card, answerGroup) {
  const maskIndex = card.masked_surface.indexOf('_');
  const correctLetter = maskIndex >= 0 ? card.surface[maskIndex] : '';
  const isLong = correctLetter === 'í' || correctLetter === 'ý';
  if (answerGroup === 'i') return isLong ? 'í' : 'i';
  if (answerGroup === 'y') return isLong ? 'ý' : 'y';
  return '';
}

function setReveal(text, answerGroup) {
  elements.fullWord.className = `full-word${answerGroup ? ` answer-${answerGroup}` : ''}`;
  elements.fullWord.textContent = text;
}

function renderMaskedWordInto(target, card, answerGroup = null) {
  target.textContent = '';
  const maskIndex = card.masked_surface.indexOf('_');
  if (maskIndex < 0) {
    target.textContent = card.masked_surface;
    return null;
  }

  target.append(document.createTextNode(card.masked_surface.slice(0, maskIndex)));
  const slot = document.createElement('span');
  slot.className = `letter-slot${answerGroup ? ` fill-${answerGroup}` : ''}${answerGroup && drag.hintReady ? ' ready' : ''}`;
  slot.textContent = letterForAnswer(card, answerGroup);
  target.append(slot);
  target.append(document.createTextNode(card.masked_surface.slice(maskIndex + 1)));
  return slot;
}

function renderMaskedWord(card, answerGroup = null) {
  elements.letterSlot = renderMaskedWordInto(elements.maskedWord, card, answerGroup);
}

function renderUpcomingCard() {
  const card = nextCardInRound();
  elements.upcomingCard.hidden = !card;
  if (!card) return;

  renderMaskedWordInto(elements.upcomingMaskedWord, card);
  elements.upcomingSentence.textContent = card.prompt_sentence;
  elements.upcomingFullWord.textContent = '';
}

function render() {
  const card = currentCard();
  const total = state.round.length;
  renderStats();
  renderUpcomingCard();

  elements.card.classList.remove('exit-correct', 'exit-wrong');
  clearDragStyles();

  if (!card) {
    if (!total) {
      elements.maskedWord.textContent = 'vyber písmeno';
      elements.sentence.textContent = 'Ťukni na písmeno hore.';
      setReveal('', null);
      setFeedback('', 'quiet');
      return;
    }
    elements.maskedWord.textContent = 'hotovo';
    elements.sentence.textContent = `Skóre ${state.correct}/${total}`;
    setReveal('', null);
    setFeedback('Kolo je hotové.', 'done');
    return;
  }

  renderMaskedWord(card);
  elements.sentence.textContent = card.prompt_sentence;
  setReveal('', null);
}

function advanceToNextCard() {
  state.index++;
  state.locked = false;
  render();
  if (currentCard()) setFeedback('', 'quiet');
}

function moveCurrentCardToOutgoingLayer(lifetime = 1200) {
  const outgoing = elements.card.cloneNode(true);
  outgoing.removeAttribute('id');
  outgoing.classList.remove('dragging');
  outgoing.classList.add('outgoing-card');
  outgoing.querySelectorAll('[id]').forEach(node => node.removeAttribute('id'));
  elements.outgoingLayer.append(outgoing);
  window.setTimeout(() => outgoing.remove(), lifetime);
  return outgoing;
}

function choose(answerGroup) {
  if (state.locked) return;
  const card = currentCard();
  if (!card) return;

  state.locked = true;
  drag.active = false;
  drag.source = null;
  elements.card.classList.remove('dragging');
  const isCorrect = Engine.checkAnswer(card, answerGroup);
  if (isCorrect) state.correct++;

  state.progress = Engine.recordAnswer(state.progress, card, isCorrect);
  Engine.saveProgress(state.progress, appStorage);

  // The outgoing card is the one place that reveals the correction. Keeping
  // the feedback line quiet avoids repeating the same message underneath it.
  setDragHint(isCorrect ? answerGroup : card.answer_group, true);
  setReveal(card.full_sentence, card.answer_group);
  setFeedback('', 'quiet');

  const outgoing = moveCurrentCardToOutgoingLayer(
    isCorrect ? 800 : WRONG_OUTGOING_LIFETIME_MS,
  );
  if (isCorrect) {
    outgoing.classList.add('exit-correct');
    showCardTear(answerGroup, outgoing);
  } else {
    outgoing.classList.add('exit-wrong');
    showWrongFallApart(outgoing);
  }
  renderStats();
  advanceToNextCard();
}

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function submitThreshold() {
  return Math.max(72, Math.min(108, elements.card.offsetWidth * 0.28));
}

function resistedDistance(distance) {
  const freeTravel = Math.min(42, elements.card.offsetWidth * 0.13);
  const maximum = Math.min(78, elements.card.offsetWidth * 0.23);
  const extraTravel = Math.max(0, Math.abs(distance) - freeTravel);
  const resistance = Math.max(54, elements.card.offsetWidth * 0.2);
  const resistedTravel = maximum - freeTravel;
  const visualDistance = Math.abs(distance) <= freeTravel
    ? Math.abs(distance)
    : freeTravel + resistedTravel * (1 - Math.exp(-extraTravel / resistance));
  return Math.sign(distance) * visualDistance;
}

function setCardDrag(dx, dy) {
  const visualX = resistedDistance(dx);
  const visualY = clamp(dy * 0.08, -12, 12);
  const pull = Math.min(1, Math.abs(visualX) / Math.max(1, elements.card.offsetWidth * 0.23));
  const rotation = clamp(visualX / 44, -1.7, 1.7);
  elements.card.style.setProperty('--drag-x', `${visualX}px`);
  elements.card.style.setProperty('--drag-y', `${visualY}px`);
  elements.card.style.setProperty('--drag-rotate', `${rotation}deg`);
  elements.card.style.setProperty('--drag-scale', String(1 + pull * 0.008));
  elements.card.style.setProperty('--drag-lift', `${Math.round(pull * 9)}px`);
  elements.card.style.setProperty('--shadow-x', `${Math.round(-visualX * 0.11)}px`);
  const ready = Math.abs(dx) >= submitThreshold();
  if (dx < -22) {
    setDragHint('i', ready);
  } else if (dx > 22) {
    setDragHint('y', ready);
  } else {
    setDragHint(null, false);
  }
}

// All drag feedback lives inside the word: the blank previews the letter in its
// answer colour, and turns solid once the card has moved far enough to submit.
function setDragHint(answerGroup, ready = false) {
  if (drag.hintAnswer === answerGroup && drag.hintReady === ready) return;
  const answerChanged = drag.hintAnswer !== answerGroup;
  drag.hintAnswer = answerGroup;
  drag.hintReady = ready;

  const card = currentCard();
  if (!card) return;
  if (answerChanged) {
    renderMaskedWord(card, answerGroup);
  } else if (elements.letterSlot) {
    elements.letterSlot.classList.toggle('ready', ready);
  }
}

function clearDragStyles() {
  elements.card.classList.remove('dragging');
  drag.hintAnswer = null;
  drag.hintReady = false;
  elements.card.style.removeProperty('--drag-x');
  elements.card.style.removeProperty('--drag-y');
  elements.card.style.removeProperty('--drag-rotate');
  elements.card.style.removeProperty('--drag-scale');
  elements.card.style.removeProperty('--drag-lift');
  elements.card.style.removeProperty('--shadow-x');
}

function targetFromDrag(dx) {
  const threshold = submitThreshold();
  if (dx <= -threshold) return 'i';
  if (dx >= threshold) return 'y';
  return null;
}

function snapCardBack() {
  drag.active = false;
  drag.source = null;
  elements.card.classList.remove('dragging');
  setCardDrag(0, 0);
  window.setTimeout(() => {
    if (!drag.active && !state.locked) clearDragStyles();
  }, 280);
}

// On load the card demonstrates a short tug toward each answer, filling the
// letter slot each way, then springs back. Any real input cancels it, so it
// never fights the child for control of the card.
let introTimers = [];

function cancelIntro() {
  if (!introTimers.length) return;
  introTimers.forEach(window.clearTimeout);
  introTimers = [];
  clearDragStyles();
}

function runIntro() {
  if (!currentCard()) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const reach = () => Math.round(submitThreshold() * 1.08);
  const at = (delay, step) => introTimers.push(window.setTimeout(step, delay));

  at(460, () => setCardDrag(-reach(), 0));
  at(1200, () => setCardDrag(reach(), 0));
  at(1940, () => setCardDrag(0, 0));
  at(2260, () => {
    introTimers = [];
    clearDragStyles();
  });
}

function beginDrag(source, id, clientX, clientY) {
  drag.active = true;
  drag.pointerId = id;
  drag.source = source;
  drag.startX = clientX;
  drag.startY = clientY;
  drag.lastX = clientX;
  drag.lastY = clientY;
  drag.startTime = performance.now();
  drag.moved = false;
  drag.hintAnswer = null;
  elements.card.classList.add('dragging');
}

function updateDrag(clientX, clientY) {
  if (!drag.active || state.locked) return;

  drag.lastX = clientX;
  drag.lastY = clientY;
  const dx = clientX - drag.startX;
  const dy = clientY - drag.startY;
  if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
  setCardDrag(dx, dy);
}

function finishDrag(clientX, clientY) {
  const dx = clientX - drag.startX;
  const wasMoved = drag.moved;
  const answerGroup = wasMoved ? targetFromDrag(dx) : null;
  if (answerGroup) {
    choose(answerGroup);
  } else {
    snapCardBack();
    if (wasMoved) setFeedback('Potiahni viac do strany.');
  }
}

function onPointerDown(event) {
  if (state.locked || drag.active || !currentCard()) return;
  if (event.pointerType === 'mouse' && event.button !== 0) return;

  drag.lastPointerAt = performance.now();
  cancelIntro();
  beginDrag('pointer', event.pointerId, event.clientX, event.clientY);
  elements.card.setPointerCapture(event.pointerId);
  event.preventDefault();
}

function onPointerMove(event) {
  if (!drag.active || drag.source !== 'pointer' || event.pointerId !== drag.pointerId || state.locked) return;

  drag.lastPointerAt = performance.now();
  updateDrag(event.clientX, event.clientY);
  event.preventDefault();
}

function onPointerUp(event) {
  if (!drag.active || drag.source !== 'pointer' || event.pointerId !== drag.pointerId) return;

  drag.lastPointerAt = performance.now();
  if (elements.card.hasPointerCapture(event.pointerId)) {
    elements.card.releasePointerCapture(event.pointerId);
  }
  finishDrag(event.clientX, event.clientY);
  event.preventDefault();
}

function onPointerCancel(event) {
  if (!drag.active || drag.source !== 'pointer' || event.pointerId !== drag.pointerId) return;
  drag.lastPointerAt = performance.now();
  if (elements.card.hasPointerCapture(event.pointerId)) {
    elements.card.releasePointerCapture(event.pointerId);
  }
  snapCardBack();
}

function onMouseDown(event) {
  if (state.locked || drag.active || !currentCard() || event.button !== 0) return;
  if (performance.now() - drag.lastPointerAt < 500) return;

  cancelIntro();
  beginDrag('mouse', 'mouse', event.clientX, event.clientY);
  event.preventDefault();
}

function onMouseMove(event) {
  if (!drag.active || drag.source !== 'mouse') return;

  updateDrag(event.clientX, event.clientY);
  event.preventDefault();
}

function onMouseUp(event) {
  if (!drag.active || drag.source !== 'mouse') return;

  finishDrag(event.clientX, event.clientY);
  event.preventDefault();
}

function firstTouch(event) {
  return event.changedTouches && event.changedTouches[0];
}

function onTouchStart(event) {
  if (state.locked || !currentCard() || drag.active) return;
  if (performance.now() - drag.lastPointerAt < 500) return;

  const touch = firstTouch(event);
  if (!touch) return;
  cancelIntro();
  beginDrag('touch', touch.identifier, touch.clientX, touch.clientY);
  event.preventDefault();
}

function onTouchMove(event) {
  if (!drag.active || drag.source !== 'touch') return;

  const touch = Array.from(event.changedTouches || []).find(item => item.identifier === drag.pointerId);
  if (!touch) return;
  updateDrag(touch.clientX, touch.clientY);
  event.preventDefault();
}

function onTouchEnd(event) {
  if (!drag.active || drag.source !== 'touch') return;

  const touch = Array.from(event.changedTouches || []).find(item => item.identifier === drag.pointerId);
  if (!touch) return;
  finishDrag(touch.clientX, touch.clientY);
  event.preventDefault();
}

function onTouchCancel(event) {
  if (!drag.active || drag.source !== 'touch') return;
  snapCardBack();
  event.preventDefault();
}

function openAbout() {
  elements.aboutOverlay.hidden = false;
  elements.aboutClose.focus();
}

function closeAbout() {
  elements.aboutOverlay.hidden = true;
  elements.aboutOpen.focus();
}

function onAboutKeyDown(event) {
  if (event.key === 'Escape' && !elements.aboutOverlay.hidden) {
    closeAbout();
  }
}

function resetRound() {
  cancelIntro();
  clearConfetti();
  elements.outgoingLayer.textContent = '';
  state.index = 0;
  state.correct = 0;
  state.locked = false;
  state.round = createCurrentRound();
  render();
  setFeedback('', 'quiet');
}

async function start() {
  try {
    const tsv = await fetch('./data/disambiguation.tsv').then(response => {
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.text();
    });
    state.cards = Engine.loadDisambiguationCards(tsv);
    populateLetterFilter();
    state.round = createCurrentRound();
    render();
    setFeedback('', 'quiet');
    runIntro();
  } catch (error) {
    elements.maskedWord.textContent = 'chyba';
    elements.sentence.textContent = 'Kartičky sa nenačítali.';
    setFeedback(error.message, 'needs-work');
  }
}

elements.letterFilter.addEventListener('click', event => {
  const button = event.target.closest('.letter-filter-button');
  if (!button) return;
  const letter = button.dataset.letter;
  if (!letter) return;

  state.selectedLetters = state.selectedLetters.includes(letter)
    ? state.selectedLetters.filter(selected => selected !== letter)
    : [...state.selectedLetters, letter].sort((left, right) => LETTER_ORDER.indexOf(left) - LETTER_ORDER.indexOf(right));
  updateLetterFilter();
  saveSettings();
  resetRound();
});
elements.aboutOpen.addEventListener('click', openAbout);
elements.aboutClose.addEventListener('click', closeAbout);
elements.aboutOverlay.addEventListener('click', closeAbout);
elements.aboutSheet.addEventListener('click', event => event.stopPropagation());
window.addEventListener('keydown', onAboutKeyDown);
elements.card.addEventListener('pointerdown', onPointerDown);
window.addEventListener('pointermove', onPointerMove);
window.addEventListener('pointerup', onPointerUp);
window.addEventListener('pointercancel', onPointerCancel);
elements.card.addEventListener('mousedown', onMouseDown);
window.addEventListener('mousemove', onMouseMove);
window.addEventListener('mouseup', onMouseUp);
elements.card.addEventListener('touchstart', onTouchStart, { passive: false });
window.addEventListener('touchmove', onTouchMove, { passive: false });
window.addEventListener('touchend', onTouchEnd, { passive: false });
window.addEventListener('touchcancel', onTouchCancel, { passive: false });

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(registration => registration.update());
  });
}

start();
</script>
</body>
</html>
